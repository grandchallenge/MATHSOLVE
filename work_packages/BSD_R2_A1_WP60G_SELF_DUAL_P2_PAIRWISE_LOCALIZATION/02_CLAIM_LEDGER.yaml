claims:
  - id: BSD-A1-WP60G-AFFINE-2COVER-001
    status: proved
    statement: >-
      Two nonempty affine fibers of nonzero F_2-valued group characters cover
      the group if and only if the characters are equal and the fiber
      constants are distinct.
  - id: BSD-A1-WP60G-SELFDUAL-PAIRWISE-002
    status: proved_conditional_on_bss_hypothesis_3_2
    statement: >-
      In the residual literal-p=2 BSS setup, if A is G_K-equivariantly
      self-dual as A ~= A^*(1), then every nonzero primal class and nonzero dual
      class admit a positive-density set of BSS auxiliary primes at which both
      localizations are nonzero.
  - id: BSD-A1-WP60G-WEIL-SELFDUAL-003
    status: proved
    statement: >-
      The Weil pairing gives a canonical G_Q-equivariant isomorphism
      E[2] ~= E[2]^*(1) for every elliptic curve E/Q.
