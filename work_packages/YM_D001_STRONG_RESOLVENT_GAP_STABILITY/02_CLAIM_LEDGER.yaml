schema_version: "1.0.0"
campaign_id: "YM-001"
work_package: "YM-D001-STRONG-RESOLVENT-GAP-STABILITY"
protected_baselines:
  math_programme: "1f4ba5fabab01c084aefab201c5a4aa594d257fc"
  mathsolve: "adaae95545abcb02db4ab9b2281981fc0f8ce07b"
claims:
  - claim_id: "YM-D001-R001"
    status: "SELECTED_RESTRICTED_TARGET_PROVED_IN_PACKAGE_NOT_CERTIFIED"
    statement: "For nonnegative self-adjoint H_n and H on one identified Hilbert space, one common spectral exclusion (0,Delta) for all sufficiently large n is preserved when (I+H_n)^(-1) converges strongly to (I+H)^(-1)."
  - claim_id: "YM-D001-L001"
    status: "PROVED_IN_PACKAGE_NOT_CERTIFIED"
    statement: "Strong-resolvent convergence preserves sigma(H_n) subset {0} union [Delta,infinity) for one fixed Delta > 0; equivalently E_H((0,Delta))=0."
  - claim_id: "YM-D001-FP001"
    status: "PROVED_EXACT_COUNTEREXAMPLE"
    statement: "Weak convergence of the resolvents is insufficient: dyadic checkerboard zero/Delta Hamiltonians can have resolvents converging weakly to a scalar Hamiltonian with energy strictly between 0 and Delta."
  - claim_id: "YM-D001-FP002"
    status: "PROVED_EXACT_COUNTEREXAMPLE"
    statement: "Strong-resolvent convergence plus a uniform spectral exclusion does not by itself preserve existence of a zero-energy vacuum; a moving rank-one vacuum may escape strongly."
  - claim_id: "YM-D001-FP003"
    status: "PROVED_EXACT_COUNTEREXAMPLE"
    statement: "Positive regulator-by-regulator gaps Delta_n with infimum zero do not imply a positive limiting gap, even under norm convergence."
  - claim_id: "YM-D001"
    status: "OPEN_RESEARCH_DEBT_REDUCED_NOT_DISCHARGED"
    statement: "Obtain a cutoff- and volume-uniform regulated spectral lower bound in fixed physical units and establish the actual regulator-to-continuum convergence/identification needed to apply the spectral-stability theorem."
  - claim_id: "YM-D005"
    status: "OPEN_RESEARCH_DEBT_REDUCED_NOT_DISCHARGED"
    statement: "The separately admitted converse-spectral implication remains blocked on reconstruction, observable completeness, and a common physical-unit decay estimate in the same four-dimensional limiting theory."
  - claim_id: "YM-001"
    status: "OPEN_PROBLEM_NO_TERMINAL_CLAIM"
    statement: "Four-dimensional Yang-Mills existence and mass gap remain unproved by this package."
external_theorem_admission:
  new_premises: false
  note: "The proof uses bounded functional calculus for nonnegative self-adjoint operators, strong convergence of uniformly bounded products, and elementary spectral mapping. These are the abstract operator-theoretic setting of the target, not a Yang-Mills-specific imported theorem."
next_boundary:
  target: "YM-D001-R002"
  statement: "For an actual regulated four-dimensional Yang-Mills Hamiltonian family, bind the physical rescaling and state-space comparison, then prove either a cutoff/volume-uniform Delta > 0 and strong-resolvent convergence to the same limiting Hamiltonian, or isolate the first precise obstruction preventing those hypotheses."
forbidden_promotions:
  - "Do not infer a positive continuum gap from regulator-dependent positive gaps whose infimum may be zero."
  - "Do not infer vacuum persistence or uniqueness from strong-resolvent spectral exclusion alone."
  - "Do not replace strong-resolvent convergence by weak resolvent convergence."
  - "Do not treat a gap uniform in raw lattice or cutoff units as a fixed physical-unit gap without an explicit scaling map."
  - "Do not infer that regulated Yang-Mills Hamiltonians satisfy the theorem hypotheses merely because the abstract theorem is proved."
  - "Do not infer continuum existence, confinement, novelty, priority, Clay-problem resolution, or MATHCERT certification."
