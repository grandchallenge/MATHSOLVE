claims:
  - claim_id: "YM-D005-R001"
    status: "SELECTED_RESTRICTED_TARGET_PROVED_IN_PACKAGE_NOT_CERTIFIED"
    statement: "For a nonnegative self-adjoint reconstructed Hamiltonian H with zero-energy vector Omega, a single common positive decay exponent Delta on a linear observable-vector class dense in Omega^perp forces E_H([0,Delta)) to vanish on Omega^perp and hence gives unique vacuum and gap at least Delta."
  - claim_id: "YM-D005-L001"
    status: "PROVED_IN_PACKAGE_NOT_CERTIFIED"
    statement: "The dense-class asymptotic semigroup bound with common Delta is equivalent, at the abstract reconstructed-Hilbert-space level, to the non-vacuum spectral lower bound Delta; the forward direction has prefactor ||psi||^2 and holds for all t >= 0."
  - claim_id: "YM-D005-FP001"
    status: "PROVED_EXACT_COUNTEREXAMPLE"
    statement: "One selected exponentially decaying channel can miss a lower-energy orthogonal state and therefore cannot imply the full Hamiltonian gap."
  - claim_id: "YM-D005-FP002"
    status: "PROVED_EXACT_COUNTEREXAMPLE"
    statement: "A dense class may have positive vector-dependent exponential rates while the infimum of those rates and the global non-vacuum spectral gap are zero."
  - claim_id: "YM-D005"
    status: "OPEN_RESEARCH_DEBT_REDUCED_NOT_DISCHARGED"
    statement: "Link Euclidean correlation decay for a sufficiently rich gauge-invariant observable class in the same reconstructed four-dimensional limiting theory to the bottom of the physical Hamiltonian spectrum, including reconstruction, density/completeness, and one common physical-unit decay exponent."
  - claim_id: "YM-001"
    status: "OPEN_PROBLEM_NO_TERMINAL_CLAIM"
    statement: "Four-dimensional Yang-Mills existence and mass gap remain unproved by this package."
external_theorem_admission:
  new_premises: false
  note: "The proof uses the spectral theorem for a nonnegative self-adjoint operator and elementary properties of finite positive measures and bounded spectral projections; no Yang-Mills-specific external theorem is imported."
next_boundary:
  target: "YM-D005-R002"
  statement: "In the same valid four-dimensional reconstructed limiting theory, identify the exact gauge-invariant positive-time observable class carrying the decay estimate and prove that its centered reconstructed image is dense in Omega^perp with one common physical-unit exponent Delta > 0."
forbidden_promotions:
  - "Do not infer a physical Yang-Mills mass gap from decay of one correlator, finitely many correlators, or any proper non-dense observable class."
  - "Do not replace one common Delta > 0 by vector-dependent rates whose infimum may be zero."
  - "Do not infer reconstruction or any Osterwalder-Schrader axiom from the abstract spectral lemma."
  - "Do not infer continuum existence, ultraviolet control, regulator survival, curvature-observable identification, or confinement."
  - "Do not mark YM-D005 discharged until reconstruction, dense observable completeness, and a common decay estimate are proved in the same limiting theory."
  - "Do not claim novelty, priority, patentability, commercial significance, Clay-problem resolution, or MATHCERT certification."
