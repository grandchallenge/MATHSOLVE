claims:
  - id: BSD-A1-WP60R-COMMON-SPAN-001
    status: proved_from_protected_WP60M
    statement: >-
      At every selected finite level, restriction to the exact BSS auxiliary
      field is injective on any finite F2-span of modified-Selmer 2-torsion
      classes satisfying the fixed canonical local condition, because the
      unique nonzero global restriction-kernel defect violates that condition.
  - id: BSD-A1-WP60R-PAIRWISE-002
    status: proved_from_protected_WP60G_WP60M
    statement: >-
      One-primal/one-dual literal-2 localization is available in the exact
      level-m BSS auxiliary-prime set for every finite coefficient level.
  - id: BSD-A1-WP60R-INJECTIVE-FAMILY-003
    status: proved_candidate
    statement: >-
      Iterated pairwise localization constructs finitely many auxiliary primes
      whose combined primal localization is injective while every selected
      prime detects a fixed nonzero dual class.
  - id: BSD-A1-WP60R-DUAL-KILL-004
    status: proved_candidate
    statement: >-
      Residual dual modified Selmer dimension can be killed one dimension at a
      time at literal 2, with optional simultaneous nonzero localization of one
      fixed nonzero primal class.
  - id: BSD-A1-WP60R-CORE-GRAPH-005
    status: proved_from_protected_WP60N_replay
    statement: >-
      The selected BSS core graph is connected for every finite coefficient
      level using the exact level-m auxiliary-prime set.
  - id: BSD-A1-WP60R-HYP42-006
    status: proved_from_protected_provider_and_localization
    statement: >-
      The selected finite-level existence-and-freeness conclusion required by
      BSS Hypothesis 4.2 is available at literal p=2.
  - id: BSD-A1-WP60R-BSS-520-007
    status: proved_candidate
    statement: >-
      BSS II Theorem 5.20 replays for every selected finite Z/2^m coefficient
      level after replacing the odd-prime localization and core-connectivity
      steps by WP60R protected interfaces.
  - id: BSD-A1-WP60R-BSS-52-008
    status: proved_candidate
    statement: >-
      The three conclusions of BSS II Theorem 5.2 replay for every selected
      finite Z/2^m coefficient level, including equality of higher Fitting
      ideals for a basis because Z/2^m is principal.
