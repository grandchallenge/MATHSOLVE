claims:
  - id: BSD-A1-WP60S-NESTED-AUXILIARY-001
    status: proved_from_protected_provider
    statement: >-
      The exact selected BSS useful-prime sets can be chosen compatibly across
      finite 2-power coefficient levels, with P_(m+1) contained in P_m, and a
      core vertex at level m+1 persists after reduction to level m.
  - id: BSD-A1-WP60S-STARK-LIMIT-002
    status: proved_from_protected_provider_and_WP60R
    statement: >-
      The selected finite Stark-system modules form a surjective inverse system
      whose inverse limit is free of rank one over Z_2.
  - id: BSD-A1-WP60S-KS-TRANSITION-003
    status: proved
    statement: >-
      Conjugating the protected Stark reductions by the finite WP60R regulator
      isomorphisms gives the unique regulator-compatible Kolyvagin reductions,
      and these reductions are transitive across levels.
  - id: BSD-A1-WP60S-INTEGRAL-REGULATOR-004
    status: proved
    statement: >-
      The componentwise regulator induces an isomorphism from the integral
      selected Stark-system module to the integral selected Kolyvagin-system
      module, and the latter is free of rank one over Z_2.
  - id: BSD-A1-WP60S-KOLYVAGIN-IDEALS-005
    status: proved_from_protected_provider_and_WP60R
    statement: >-
      The finite Kolyvagin ideals are compatible under coefficient reduction
      and define integral ideals in Z_2.
  - id: BSD-A1-WP60S-INTEGRAL-FITTING-006
    status: proved_from_protected_provider_and_WP60R
    statement: >-
      Integral Kolyvagin ideals lie in the corresponding Z_2 Fitting ideals,
      with equality in every degree for a basis integral Kolyvagin system.
  - id: BSD-A1-WP60S-BSS-525-007
    status: proved_candidate
    statement: >-
      The three conclusions of BSS II Theorem 5.25 replay on the exact selected
      canonical literal-p=2 lane after replacing the source use of full
      Hypothesis 4.7(iii) by protected selected modified-Selmer coefficient
      reduction and protected cross-level transition interfaces.
