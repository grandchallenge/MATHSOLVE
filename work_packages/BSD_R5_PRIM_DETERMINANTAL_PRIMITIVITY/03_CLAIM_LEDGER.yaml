claims:
  - claim_id: BSD-R5-PRIM-LINE-001
    status: PROVED_IN_PACKAGE
    statement: The compatible cyclotomic determinant and selected Kolyvagin-system inverse limits are free rank-one Lambda modules and the protected Kato determinant preimage maps to the compatible Kato-derived system.
  - claim_id: BSD-R5-PRIM-RESIDUE-002
    status: PROVED_IN_PACKAGE
    statement: For A=Lambda_(2), the residue field is F2((T)); a Lambda coordinate is an A-unit exactly when its reduction in F2[[T]] is nonzero.
  - claim_id: BSD-R5-PRIM-COMPARE-003
    status: PROVED_FROM_PROTECTED_R5_LIFT
    statement: The retained real, ordinary, and finite-control comparison terms are units or vanish after localization at (2), so they do not alter height-one primitivity.
  - claim_id: BSD-R5-PRIM-RESIDUAL-004
    status: PROVED_IN_PACKAGE
    statement: R5-PRIM is equivalent to nonvanishing of the residual inverse-limit Kato-derived Kolyvagin system in KS_Lambda/2.
  - claim_id: BSD-R5-PRIM-FINITE-DETECT-005
    status: PROVED_IN_PACKAGE
    statement: R5-PRIM is equivalent to existence of some finite cyclotomic layer n with nonzero mod-2 Kato-derived Kolyvagin system; finite-layer basis status is not required.
  - claim_id: BSD-R5-PRIM-RESIDUAL-NONVANISHING-006
    status: OPEN_SUBSTANTIVE_THEOREM
    statement: Some finite cyclotomic mod-2 Kato-derived Kolyvagin system is nonzero uniformly on the selected good-ordinary irreducible S3 lane.

