claims:
  - claim_id: BSD-A1-WP40-LOCAL-QUOTIENT-DUAL-001
    status: PROVED_IN_PACKAGE
    statement: >-
      Local Tate duality induces a perfect finite pairing between the compact
      quotient R_K=U_Kum/U_str and the discrete quotient
      R_K^dual=U_str^perp/U_Kum^perp.
  - claim_id: BSD-A1-WP40-ANNIHILATOR-001
    status: PROVED_IN_PACKAGE
    statement: >-
      Under this quotient pairing, the annihilator of the compact global-hit
      subgroup J_K is exactly the dual global-hit subgroup D_K obtained from
      global discrete classes satisfying the annihilator of the strict compact
      local condition.
  - claim_id: BSD-A1-WP40-COMPLEMENT-001
    status: PROVED_IN_PACKAGE
    statement: >-
      If j_K=len_Z2 J_K and d_K=len_Z2 D_K, then
      j_K+d_K=2 ord_2(3-a_2)+2 sum_{ell|N} ord_2(c_ell).
  - claim_id: BSD-A1-WP40-D2B-REDUCTION-001
    status: PROVED_BOUNDED_REDUCTION
    statement: >-
      Evaluating the K-side Greenberg/Kummer correction is equivalent to
      evaluating the finite dual global hit D_K. No rank-one character or
      height nondegeneracy is assumed.
