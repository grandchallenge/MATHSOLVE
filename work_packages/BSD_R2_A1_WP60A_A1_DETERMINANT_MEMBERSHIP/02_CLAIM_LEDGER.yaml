claims:
  - claim_id: BSD-A1-WP60A-A1-DET-LATTICE-001
    status: PROVED_COMMUTATIVE_ALGEBRA
    statement: >-
      For a two-term perfect complex [P^1 -> P^2] over a DVR with free
      rank-one H^1 and finite H^2, the inverse determinant lattice maps to
      Fitt^0(H^2) times the integral H^1 lattice under the canonical rational
      determinant trivialization.
  - claim_id: BSD-A1-WP60A-A1-MEMBERSHIP-001
    status: PROVED_COMMUTATIVE_ALGEBRA
    statement: >-
      For z=aP on a primitive H^1 basis, determinant membership is equivalent
      to v(a) >= length(H^2), equivalently to the one-sided Fitting
      divisibility encoded by z belonging to Fitt^0(H^2) H^1.
  - claim_id: BSD-A1-WP60A-A1-PRIMITIVITY-001
    status: PROVED_COMMUTATIVE_ALGEBRA
    statement: >-
      The class z is the image of a basis of the inverse determinant line if
      and only if v(a)=length(H^2); determinant primitivity is equality, not
      mere membership.
  - claim_id: BSD-A1-WP60A-A1-ARITHMETIC-REDUCTION-001
    status: PROVED_REDUCTION_FROM_PROTECTED_SOURCE_INTERFACE
    statement: >-
      At the height-one prime (2), a BKS-style determinant lift of the fixed
      Kato/analytic class is equivalent to the one-sided Fitting inequality
      that the protected Kato p=2 interface does not supply at that prime.
