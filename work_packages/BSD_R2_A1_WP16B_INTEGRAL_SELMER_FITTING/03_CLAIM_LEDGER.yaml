claims:
  - claim_id: "BSD-A1-IF001"
    status: "PROVED_IN_PACKAGE_FROM_PROTECTED_INPUTS"
    statement: "With D_E := E(Q) tensor (Q_2/Z_2), the primitive classical direct-limit Kummer tower fits canonically into 0 -> D_E -> Sel_{2^infinity}^{Kum}(E/Q) -> Sha(E/Q)[2^infinity] -> 0; D_E has corank one in the selected class."
  - claim_id: "BSD-A1-IF002"
    status: "PROVED_IN_PACKAGE_FROM_PROTECTED_INPUTS"
    statement: "For X_E := Sel_{2^infinity}^{Kum}(E/Q)^vee and L_E := D_E^vee, the canonical torsion submodule Tor_{Z_2}(X_E) equals Sha(E/Q)[2^infinity]^vee and X_E/Tor(X_E) is canonically the free rank-one module L_E."
  - claim_id: "BSD-A1-IF003"
    status: "PROVED_IN_PACKAGE_FROM_PROTECTED_INPUTS"
    statement: "len_{Z_2} Tor(X_E) = lim_n (ord_2 #Sel_{2^n}(E/Q) - n)."
  - claim_id: "BSD-A1-IF004"
    status: "PROVED_IN_PACKAGE_FROM_PROTECTED_INPUTS"
    statement: "Fitt^0_{Z_2}(Tor(X_E)) = 2^{lim_n s_n(E)} Z_2 exactly as an ideal."
  - claim_id: "BSD-A1-IF005"
    status: "PROVED_EQUIVALENT_REFORMULATION"
    statement: "Within the selected class, BSD-R2-A1 is equivalent to delta_2(E) = v_2(Fitt^0_{Z_2}(Tor(X_E)))."
  - claim_id: "BSD-A1-IF006"
    status: "INTERFACE_BOUNDARY_PROVED_FROM_PROTECTED_WP06_WP13"
    statement: "The WP16B invariant uses primitive Kummer local conditions. Greenberg/ordinary conditions at 2 and imprimitive bad-prime conditions are distinct interfaces unless an exact comparison theorem computes the full 2-primary defect."
  - claim_id: "BSD-R2-A1"
    status: "SELECTED_RESEARCH_TARGET_UNPROVED"
    statement: "Exact WP00-normalized 2-primary rank-one BSD valuation identity for the selected class."
