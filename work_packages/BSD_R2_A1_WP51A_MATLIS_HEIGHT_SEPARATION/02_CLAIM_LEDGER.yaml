claims:
  - id: BSD-A1-WP51A-MATLIS-QUOTIENT-001
    status: proved
    statement: >-
      If N_K is the Matlis annihilator of K_K^sil in the discrete dual strict
      Selmer group, then 0 -> N_K -> S_str^dual -> D_K -> 0 canonically.
  - id: BSD-A1-WP51A-TORSION-BLIND-002
    status: proved
    statement: >-
      Every finite subgroup of strict H2 is killed by the Z_2-valued degree-(2,1)
      lattice duality pairing used in the first Nekovar height.
  - id: BSD-A1-WP51A-HEIGHT-FACTORIZATION-003
    status: proved
    statement: >-
      The first strict cyclotomic height factors through strict H2 modulo torsion;
      K_K^sil is invisible to that height pairing.
  - id: BSD-A1-WP51A-D2-SEPARATION-004
    status: proved
    statement: >-
      The finite WP40 Matlis correction and fixed-2 first-height nondegeneracy are
      distinct obligations; neither formally implies the other.
