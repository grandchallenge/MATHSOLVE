schema_version: "1.0.0"
campaign_id: "BSD-001"
work_package: "BSD-R2-A1-WP14-CHAO-LI-APPLICABILITY"
claims:
  - claim_id: "BSD-WP14-MATRIX-001"
    status: "PROVED_IN_PACKAGE_WITH_ADMITTED_SOURCE_BOUNDARY"
    statement: "After WP09, WP12, and WP13, Chao Li's mod-2 route has automatic residual surjectivity and reduction-at-2 compatibility, but retains the all-bad-Tamagawa-odd residual-conductor condition, a separate nontrivial local restriction at 2, and the minimal 2-Selmer hypothesis."
  - claim_id: "BSD-WP14-Q-002"
    status: "PROVED_IN_PACKAGE"
    statement: "For every WP09 auxiliary K, infinitely many primes q can be chosen simultaneously inert in K with order-two residual Frobenius; such q have even a_q and satisfy the mod-2 level-raising parity condition."
  - claim_id: "BSD-WP14-SELMER-003"
    status: "PROVED_IN_PACKAGE"
    statement: "In the WP09 auxiliary lane, rank E(K)=1, E(K)[2]=0, and dim_F2 Sel_2(E/K)=1+dim_F2 Sha(E/K)[2]; hence s_2(E/K)=1 iff Sha(E/K)[2]=0."
  - claim_id: "BSD-WP14-ROUTE-004"
    status: "ROUTE_DIAGNOSIS"
    statement: "The admitted Chao Li theorem sharpens the obstruction to the standard odd-prime rank-lowering/primitivity mechanism on its restricted hypothesis locus; it does not furnish a uniform proof of BSD-R2-A1."
  - claim_id: "BSD-R2-A1"
    status: "SELECTED_RESEARCH_TARGET_UNPROVED"
    statement: "Exact 2-primary rank-one BSD valuation identity under the protected selected hypotheses."
forbidden_promotions:
  - "Do not infer that analytic rank one over K forces s_2(E/K)=1."
  - "Do not delete Chao Li's local nontriviality-at-2 condition from the source theorem."
  - "Do not treat residual surjectivity as implying residual-conductor equality."
  - "Do not promote the source's 2351a1 example to a selected-target instance without an independent exact analytic-rank/interface check."
  - "Do not infer p=2 Kolyvagin primitivity, a Sha/index equality, BSD-R2-A1, novelty, priority, or MATHCERT certification."
