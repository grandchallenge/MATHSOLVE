claims:
  - claim_id: BSD-R5-EQUIV-RING-001
    status: PROVED_IN_PACKAGE
    statement: R_mn is local zero-dimensional complete-intersection Gorenstein with residue F2 and one-dimensional socle.
  - claim_id: BSD-R5-EQUIV-TAU-002
    status: PROVED_IN_PACKAGE
    statement: The protected fixed odd multiplicative inertia element gives a free rank-one quotient over every R_mn.
  - claim_id: BSD-R5-EQUIV-SL2-H1-003
    status: PROVED_IN_PACKAGE
    statement: For m>=2, H1(SL2(Z/2^m), (Z/2^m)^2) has order two and its nonzero class is detected on the primitive upper unipotent.
  - claim_id: BSD-R5-EQUIV-LAYER-H1-004
    status: PROVED_IN_PACKAGE
    statement: The finite cyclotomic-layer image has the same unique order-two defect.
  - claim_id: BSD-R5-EQUIV-SELMER-RES-005
    status: PROVED_IN_PACKAGE
    statement: The unique equivariant defect is excluded from every actual selected modified primal and dual Selmer group by the fixed local condition at ell.
  - claim_id: BSD-R5-EQUIV-LARGE-006
    status: PROVED_IN_PACKAGE
    statement: Socle detection and Nakayama reduction lift the selected characteristic-two localization, large-product and core-graph mechanism to R_mn.
  - claim_id: BSD-R5-EQUIV-DET-STARK-007
    status: PROVED_IN_PACKAGE
    statement: The real-place-corrected determinant-to-Stark map is an isomorphism of the relevant rank-one lattices; the archimedean correction has unit determinant ideal and no generator normalization is claimed.
  - claim_id: BSD-R5-EQUIV-REGULATOR-008
    status: PROVED_IN_PACKAGE
    statement: The selected rank-one Stark-to-Kolyvagin regulator is an isomorphism over every R_mn.
  - claim_id: BSD-R5-EQUIV-KATO-DERIVATIVE-009
    status: PROVED_IN_PACKAGE
    statement: The equivariant Kato derivative has first component z_Qn mod 2^m and is compatible in m and n.
  - claim_id: BSD-R5-EQUIV-BASICNESS-010
    status: PROVED_IN_PACKAGE
    statement: The selected cyclotomic Kato zeta class belongs to the cyclotomic determinant lattice at literal p=2.
  - claim_id: BSD-R5-LIFT-011
    status: PROVED_IN_PACKAGE
    statement: After the protected local comparisons and localization at (2), WP60A-A1 converts determinant membership into the required one-sided height-one-(2) Fitting divisibility.

