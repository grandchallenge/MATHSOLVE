claims:
  - claim_id: BSD-A1-WP60B-DIFF-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "For the same protected parametrization f, the Kriz-Li normalized differential satisfies omega_f^KL = +/- C_f^{-1} omega_E; the logarithms differ by the same scalar, and C_f is a 2-adic unit."
  - claim_id: BSD-A1-WP60B-KAPPA-INTEGRAL-001
    status: PROVED
    statement: "For primitive P, kappa_2(E,P)=((3-a_2)/2) log_{omega_E}(P) lies in Z_2."
  - claim_id: BSD-A1-WP60B-KL-TRANSPORT-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "The Kriz-Li normalized logarithmic quantity factors exactly as KL_2(E,K,f)=u_f m_K(f) kappa_2(E,P), with u_f in Z_2^x."
  - claim_id: BSD-A1-WP60B-F-CLASSIFY-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "On the protected selected lane, Kriz-Li Assumption (F) is equivalent to m_K(f) odd together with kappa_2(E,P) a 2-adic unit."
  - claim_id: BSD-A1-WP60B-K2TORS-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "Surjective E[2] implies E(K)[2]=0 for every quadratic K/Q on the selected lane."
  - claim_id: BSD-A1-WP60B-INDEX-PARITY-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "The protected Heegner point P_K(f) is indivisible by 2 in E(K) if and only if m_K(f) is odd."
  - claim_id: BSD-A1-WP60B-INDEPENDENCE-001
    status: PROVED_FROM_PROTECTED_INPUTS
    statement: "Kriz-Li (F) is mixed but supplies no independent K-varying escape: its K-varying content is precisely the unknown Heegner-index parity, together with a fixed local-unit condition."

