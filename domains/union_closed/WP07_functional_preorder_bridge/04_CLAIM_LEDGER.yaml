foundation_doctrine_version: 1
foundational_profile:
  carrier_type: finite
  carrier_description: Finite functional-preorder order-ideal families over an explicit finite ground set.
  ambient_structure:
    - order_structure
    - computable_presentation
    - finite_set_family
  admissible_operations:
    - equality_test
    - membership_test
    - order_comparison
    - finite_search
  regularity:
    - finite
    - decidable
    - computable
  axiom_profile:
    base: finite
    choice_usage: finite_choice
    excluded_middle: used
  witness_policy:
    existence_claim: extractable
    expected_artifact: local_lean_proof_or_semantically_audited_transport
  pathology_risk:
    level: low
    triggers: []
    notes: WP07 is confined to finite preorders and finite set families. D004 is locally closed; D005 complement duality is the active restricted mathematical debt.
foundation_routing:
  selected_route: R0
  route_reason: The branch is finite, decidable, and computably presented. D002-D004 have checked local Lean surfaces.
  foundational_profile_used: true
  regularization_attempted: false
  choice_audit:
    status: weak_choice
    notes: The audited source theorem reports only propext, Classical.choice, and Quot.sound. The local semantic bridge introduces no explicit axiom declaration.
  constructive_content:
    status: restricted_theorem_checked
    notes: The semantic obstruction, exact local predicate, NDS normalization, source-shaped NDS theorem, and D004 average-rarity theorem are checked locally.
  certificate_boundary:
    target: local_lean_theorem_development
    checker_inputs:
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderBridge.lean
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderD004.lean
      - MATHSOLVE/MathSolve/UnionClosed/AvgRarePort/Secondary/MainStatement.lean
      - MATHSOLVE/domains/union_closed/WP07_functional_preorder_bridge/01_RESULT_STATUS.md
      - MATHSOLVE/domains/union_closed/WP07_functional_preorder_bridge/03_PROOF_DEBT_REGISTER.md
      - MATHFORGE/sources/UC-001/AVG_RARE_WP07_SOURCE_PROVENANCE.md
claims:
  - claim_id: UC-WP07-P001
    short_name: functional-preorder source branch independently audited
    claim_text: >-
      The selected avg-rare revision 21451877e9996a295bbc1ec25856d07fa302d48c
      is exactly two comment-only commits after the historical WP07 pin,
      independently builds under Lean 4.23.0 and mathlib v4.23.0, and exposes
      AvgRare.MainStatement.main_nds_nonpos with the audited functional-preorder
      NDS-nonpositivity contract.
    claim_class: LITERATURE_DERIVED
    support_type: SOURCE_BUILD_AUDIT
    status: AUDITED
    certainty: SOURCE_BUILT
    source_or_artifact:
      - MATHFORGE/sources/UC-001/AVG_RARE_WP07_SOURCE_PROVENANCE.md
      - MATHSOLVE/.github/workflows/uc-wp07-functional-preorder.yml
      - https://github.com/kashiwabarakenji/avg-rare/tree/21451877e9996a295bbc1ec25856d07fa302d48c
    assumptions:
      - Independent build success and an axiom report establish source facts, not governed local theorem authority.
      - The external repository is not imported as a trusted MATHSOLVE dependency.
    promotion_condition: Local theorem authority requires a checked local proof or semantic transport.
    knowledge_graph_refs:
      - UC-WP05
      - UC-METHOD-AVERAGING

  - claim_id: UC-WP07-P002
    short_name: functional-preorder not direct WP06 consumer
    claim_text: >-
      Functional-preorder order ideals are not generally subset-downward closed
      below every proper member, so they do not automatically satisfy
      IsIdealFamilyOn and cannot be presented as a direct application of the
      checked WP06 ideal-family complement theorem.
    claim_class: PROVED_IN_PACKAGE
    support_type: LEAN_PROOF
    status: CHECKED
    certainty: LOCAL_THEOREM
    source_or_artifact:
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderBridge.lean
    assumptions:
      - The theorem is a semantic obstruction to predicate reuse, not a counterexample to Frankl's conjecture.
      - Some special functional-preorder families may satisfy IsIdealFamilyOn; the claim is only that this is not automatic in general.
    promotion_condition: None inside MATHSOLVE for this bounded semantic statement; MATHCERT remains independent for any certification claim.
    knowledge_graph_refs:
      - UC-WP05
      - UC-METHOD-AVERAGING

  - claim_id: UC-WP07-P003
    short_name: exact local functional-preorder predicate established
    claim_text: >-
      IsFunctionalPreorderIdealFamilyOn represents exactly a finite nonempty
      ground, a self-map on the ground subtype, reflexive-transitive functional
      reachability, the induced preorder order ideals, and extensional equality
      of the finite family with all such ideals.
    claim_class: PROVED_IN_PACKAGE
    support_type: LEAN_DEFINITION_AND_LEMMAS
    status: CHECKED
    certainty: LOCAL_SEMANTIC_SURFACE
    source_or_artifact:
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderBridge.lean
      - MATHSOLVE/domains/union_closed/WP07_functional_preorder_bridge/01_RESULT_STATUS.md
    assumptions:
      - This predicate is separate from IsIdealFamilyOn.
      - Carrier equality and family extensional equality remain explicit.
    promotion_condition: Use this predicate as the only WP07 local class unless a checked semantic defect is found.
    knowledge_graph_refs:
      - UC-METHOD-AVERAGING

  - claim_id: UC-WP07-P004
    short_name: D004 functional-preorder average rarity checked
    claim_text: >-
      Every finite family represented by IsFunctionalPreorderIdealFamilyOn is
      average-rare. The checked proof compiles the audited avg-rare theorem cone
      inside MATHSOLVE, proves explicit equality of reachability, order-ideal
      membership, finite family, and NDS across the transport boundary, proves
      SourceShapedMainNDSStatement, and derives D004AverageRarityStatement.
    claim_class: PROVED_IN_PACKAGE
    support_type: LEAN_PROOF_AND_SEMANTIC_TRANSPORT
    status: CHECKED
    certainty: LOCAL_THEOREM
    source_or_artifact:
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderBridge.lean
      - MATHSOLVE/MathSolve/UnionClosed/FunctionalPreorderD004.lean
      - MATHSOLVE/MathSolve/UnionClosed/AvgRarePort/
    assumptions:
      - The conclusion is restricted to the exact D003 functional-preorder class.
      - The vendored proof cone derives from avg-rare@21451877e9996a295bbc1ec25856d07fa302d48c and includes only module-path plus Lean-4.29 compatibility adaptations.
      - This local theorem is not a MATHCERT certification.
    promotion_condition: D005 may use this theorem only for the exact D003 class. No universal UC-P04 or UC-FRANKL promotion follows.
    knowledge_graph_refs:
      - UC-METHOD-AVERAGING
      - UC-WP05

  - claim_id: UC-WP07-P005
    short_name: universal Frankl boundary unchanged
    claim_text: >-
      The WP07 checked surface is restricted to functional-preorder order-ideal
      families and establishes no representation theorem for arbitrary finite
      union-closed families.
    claim_class: GOVERNANCE_BOUNDARY
    support_type: CLAIM_FIREWALL
    status: ACTIVE
    certainty: EXACT_BOUNDARY
    source_or_artifact:
      - MATHSOLVE/campaign_ledgers/UC-001/proof_obligation_dag.json
      - MATHSOLVE/campaign_manifests/UC-001.json
      - MATHCERT/governance/certification_routes.json
    assumptions:
      - UC-P04 remains open.
      - UC-FRANKL remains open.
    promotion_condition: No universal promotion by implication from WP07 restricted results.
    knowledge_graph_refs:
      - UC-FRANKL
      - UC-P04
