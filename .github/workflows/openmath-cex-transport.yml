name: OPENMATH CEX transport contract

on:
  pull_request:
    paths:
      - ".gcl/campaigns/OPENMATH-2026/CEX_ASSIGNMENTS.json"
      - "handoffs/OPENMATH-2026/CEX_AGENT_ENTRYPOINT.md"
      - "handoffs/OPENMATH-2026/CEX_JOB_BOARD.md"
      - "handoffs/OPENMATH-2026/CEX_TRANSPORT_CONTRACT.md"
      - "handoffs/OPENMATH-2026/launch/**"
      - "ci/validate_openmath_cex_transport.py"
      - ".github/workflows/openmath-cex-transport.yml"
  push:
    branches: [main]
    paths:
      - ".gcl/campaigns/OPENMATH-2026/CEX_ASSIGNMENTS.json"
      - "handoffs/OPENMATH-2026/CEX_AGENT_ENTRYPOINT.md"
      - "handoffs/OPENMATH-2026/CEX_JOB_BOARD.md"
      - "handoffs/OPENMATH-2026/CEX_TRANSPORT_CONTRACT.md"
      - "handoffs/OPENMATH-2026/launch/**"
      - "ci/validate_openmath_cex_transport.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Validate CEX transport contract
        run: python ci/validate_openmath_cex_transport.py
