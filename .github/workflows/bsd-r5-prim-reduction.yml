name: BSD R5-PRIM normalized Kato index reduction

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R5_PRIM_KATO_INDEX_REDUCTION/**'
      - 'handoffs/BSD-001/R5_PRIM_FRONTIER.md'
      - '.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'
      - '.gcl/operations/BSD-R5-PRIM/**'
      - '.gcl/admission/BSD-R5-PRIM/**'
      - '.gcl/completions/BSD-R5-PRIM/**'
      - 'tools/gcl_campaign_preflight_r5_prim.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-r5-prim-reduction.yml'
      - '.github/workflows/bsd-r5-lift-equivariant-certificate.yml'
      - '.github/workflows/bsd-wp60t-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R5_PRIM_KATO_INDEX_REDUCTION/**'
      - 'handoffs/BSD-001/R5_PRIM_FRONTIER.md'
      - '.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'
      - '.gcl/operations/BSD-R5-PRIM/**'
      - '.gcl/admission/BSD-R5-PRIM/**'
      - '.gcl/completions/BSD-R5-PRIM/**'
      - 'tools/gcl_campaign_preflight_r5_prim.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-r5-prim-reduction.yml'
      - '.github/workflows/bsd-r5-lift-equivariant-certificate.yml'
      - '.github/workflows/bsd-wp60t-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primitivity-index-reduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run R5-PRIM deterministic preflight
        run: python tools/gcl_campaign_preflight_r5_prim.py BSD-001 BSD-R5-PRIM
      - name: Replay protected WP60R dependency certificate
        run: python work_packages/BSD_R2_A1_WP60R_BSS_THEOREM_REPLAY/04_DEPENDENCY_REPLAY_CERTIFICATE.py
      - name: Replay protected WP60S inverse-limit certificate
        run: python work_packages/BSD_R2_A1_WP60S_BSS_INVERSE_LIMIT/04_INVERSE_LIMIT_REPLAY_CERTIFICATE.py
      - name: Replay protected WP60T derivative certificate
        run: python work_packages/BSD_R2_A1_WP60T_BSS_DERIVATIVE_APPLICATION/04_DERIVATIVE_REPLAY_CERTIFICATE.py
      - name: Replay protected R5-LIFT structural certificate
        run: python work_packages/BSD_R5_LIFT_EQUIVARIANT_DETERMINANT/04_EQUIVARIANT_REPLAY_CERTIFICATE.py
      - name: Assert reduction claims and firewalls
        shell: bash
        run: |
          ledger=work_packages/BSD_R5_PRIM_KATO_INDEX_REDUCTION/03_CLAIM_LEDGER.yaml
          theorem=work_packages/BSD_R5_PRIM_KATO_INDEX_REDUCTION/01_PRIMITIVITY_INDEX_REDUCTION_THEOREM.md
          grep -q 'P2_KATO_KOLYVAGIN_STRUCTURE_FORMULA_REPLAYED' "$ledger"
          grep -q 'P2_KATO_KOLYVAGIN_RIGIDITY_REPLAYED' "$ledger"
          grep -q 'R5_PRIM_EQUIVALENT_TO_P2_KATO_KOLYVAGIN_PRIMITIVITY_INDEX_EQUALITY' "$ledger"
          grep -q 'MISSING_P2_KATO_KOLYVAGIN_PRIMITIVITY_INDEX_EQUALITY' "$theorem"
          grep -q 'candidate_disposition: BLOCKED' "$ledger"
          grep -q 'r5_prim: false' "$ledger"
          grep -q 'd2d: false' "$ledger"
          grep -q 'bsd_r2_a1: false' "$ledger"
          grep -q 'literal_p2_kurihara_explicit_reciprocity: false' "$ledger"
          grep -q 'mathcert_certification: false' "$ledger"
      - name: Validate completion receipt when present
        shell: bash
        run: |
          receipt=.gcl/completions/BSD-R5-PRIM/COMPLETION_RECEIPT.json
          if test -f "$receipt"; then
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-PRIM
          fi
