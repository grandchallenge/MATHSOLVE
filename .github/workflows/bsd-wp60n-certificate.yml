name: BSD WP60N certificate

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R2_A1_WP60N_COISOTROPIC_P2_CONNECTIVITY/**'
      - 'handoffs/BSD-001/WP60N_FRONTIER.md'
      - '.github/workflows/bsd-wp60n-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R2_A1_WP60N_COISOTROPIC_P2_CONNECTIVITY/**'
      - 'handoffs/BSD-001/WP60N_FRONTIER.md'
      - '.github/workflows/bsd-wp60n-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-exchange-relation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Replay WP60N finite exchange relation certificate
        run: python work_packages/BSD_R2_A1_WP60N_COISOTROPIC_P2_CONNECTIVITY/02_EXCHANGE_RELATION_CERTIFICATE.py
