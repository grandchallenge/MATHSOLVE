name: BSD R5-WIT certificate

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-WIT/**'
      - '.gcl/admission/BSD-R5-WIT/**'
      - '.gcl/completions/BSD-R5-WIT/**'
      - 'tools/gcl_campaign_preflight_r5_wit.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-wit-certificate.yml'
      - '.ghos-routing/workflows.json'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-WIT/**'
      - '.gcl/admission/BSD-R5-WIT/**'
      - '.gcl/completions/BSD-R5-WIT/**'
      - 'tools/gcl_campaign_preflight_r5_wit.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-wit-certificate.yml'
      - '.ghos-routing/workflows.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert exact subject checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
          gp --version
      - name: Exact R5-WIT operation preflight
        run: python tools/gcl_campaign_preflight_r5_wit.py BSD-001 BSD-R5-WIT
      - name: Replay protected R5-RECIP certificate
        run: python work_packages/BSD_R5_RECIP_P2_NORMALIZED_RECIPROCITY/04_RECIPROCITY_CERTIFICATE.py
      - name: Replay control local t2 certificate
        run: python work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/02_LOCAL_T2_CERTIFICATE.py
      - name: Replay 79a1 local t2 certificate
        run: python work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/04_LOCAL_T2_79A1_CERTIFICATE.py
      - name: Replay cohort local t2 certificate
        run: python work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/08_COHORT_LOCAL_T2_CERTIFICATE.py
      - name: Exact normalized Kurihara control and cohort probes
        shell: bash
        run: |
          set -euo pipefail
          out="$(gp -q work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/05_KURIHARA_PARI_PROBE.gp 2>&1)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Fq '***'; then
            echo "PARI/GP reported an exception in control scan" >&2
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'R5_WIT_PROBE_COMPLETE'

          out2="$(gp -q work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/06_COHORT_DISCOVERY.gp 2>&1)"
          printf '%s\n' "$out2"
          if printf '%s\n' "$out2" | grep -Fq '***'; then
            echo "PARI/GP reported an exception in cohort discovery" >&2
            exit 1
          fi
          printf '%s\n' "$out2" | grep -q 'DISCOVERY_HITS \[\]'
          printf '%s\n' "$out2" | grep -q 'R5_WIT_COHORT_DISCOVERY_COMPLETE'
      - name: Assert blocked boundary and claim firewall
        shell: bash
        run: |
          ledger=work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/09_CLAIM_LEDGER.yaml
          grep -q 'BSD-R5-WIT-DIRECT-DETECTOR-006' "$ledger"
          grep -q 'MISSING_P2_BASE_KATO_CLASS_MOD2_NONVANISHING_ON_SELECTED_RANK_ONE_LANE' "$ledger"
          grep -q 'candidate_disposition: BLOCKED' "$ledger"
          grep -q 'r5_lift: true' "$ledger"
          grep -q 'r5_prim: false' "$ledger"
          grep -q 'r5_res: false' "$ledger"
          grep -q 'bsd_r2_a1: false' "$ledger"
          grep -q 'mathcert_certification: false' "$ledger"
      - name: Validate completion receipt when present
        shell: bash
        run: |
          if [ -f .gcl/completions/BSD-R5-WIT/COMPLETION_RECEIPT.json ]; then
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-WIT
          else
            echo 'completion receipt not present in pre-merge candidate'
          fi
