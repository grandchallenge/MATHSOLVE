name: BSD R5-RECIP certificate

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R5_RECIP_P2_NORMALIZED_RECIPROCITY/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-RECIP/**'
      - '.gcl/admission/BSD-R5-RECIP/**'
      - '.gcl/completions/BSD-R5-RECIP/**'
      - 'tools/gcl_campaign_preflight_r5_recip.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-recip-certificate.yml'
      - '.ghos-routing/workflows.json'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R5_RECIP_P2_NORMALIZED_RECIPROCITY/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-RECIP/**'
      - '.gcl/admission/BSD-R5-RECIP/**'
      - '.gcl/completions/BSD-R5-RECIP/**'
      - 'tools/gcl_campaign_preflight_r5_recip.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-recip-certificate.yml'
      - '.ghos-routing/workflows.json'

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate current or historical operation state
        shell: bash
        run: |
          current=$(python -c "import json; print(json.load(open('.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'))['current_operation'])")
          if [ "$current" = "BSD-R5-RECIP" ]; then
            python tools/gcl_campaign_preflight_r5_recip.py BSD-001 BSD-R5-RECIP
          else
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-RECIP
          fi
      - name: Replay protected WP60T derivative certificate
        run: python work_packages/BSD_R2_A1_WP60T_BSS_DERIVATIVE_APPLICATION/04_DERIVATIVE_REPLAY_CERTIFICATE.py
      - name: Replay protected R5-RES residual-detection certificate
        run: python work_packages/BSD_R5_RES_RESIDUAL_KATO_NONVANISHING/04_RESIDUAL_DETECTION_CERTIFICATE.py
      - name: Validate literal-2 normalized reciprocity theorem
        run: python work_packages/BSD_R5_RECIP_P2_NORMALIZED_RECIPROCITY/04_RECIPROCITY_CERTIFICATE.py
      - name: Validate completion receipt when present
        shell: bash
        run: |
          if [ -f .gcl/completions/BSD-R5-RECIP/COMPLETION_RECEIPT.json ]; then
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-RECIP
          else
            echo 'completion receipt not present in pre-merge candidate'
          fi
