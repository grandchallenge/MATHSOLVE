name: OPENMATH Kobon search94 tranche2

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - ".github/workflows/openmath-kobon-search94-tranche2.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinated-exact-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: H1-13 tranche2 exact coordinated search
        id: search
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python search_94_tranche2.py \
            --keep-per-line 6 \
            --report /tmp/kobon94-tranche2.json \
            --candidate-dir /tmp/kobon94-tranche2-candidate
          cat /tmp/kobon94-tranche2.json
          if [ -f /tmp/kobon94-tranche2-candidate/solution.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cp /tmp/kobon94-tranche2-candidate/solution.json /tmp/kobon94-tranche2-solution.json
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Independent direct-oracle replay
        if: steps.search.outputs.found == 'true'
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          mkdir -p /tmp/kobon94-replay
          cp /tmp/kobon94-tranche2-solution.json /tmp/kobon94-replay/solution.json
          python kobon_direct_oracle.py /tmp/kobon94-replay/solution.json --n 18 --expect 94 --output /tmp/kobon94-direct.json

      - name: Install pinned uv launcher
        if: steps.search.outputs.found == 'true'
        run: python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Install official AutoLab CLI
        if: steps.search.outputs.found == 'true'
        run: |
          curl -fsSL https://app.autolab.ai/install.sh -o /tmp/autolab-install.sh
          sha256sum /tmp/autolab-install.sh
          sh /tmp/autolab-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate AutoLab
        if: steps.search.outputs.found == 'true'
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        run: |
          test -n "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" login --token "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" whoami

      - name: Pull public Kobon hill
        if: steps.search.outputs.found == 'true'
        run: "$HOME/.local/bin/autolab" hills pull alejandrozu/kobon-triangles

      - name: AutoLab H1-07 replay
        if: steps.search.outputs.found == 'true'
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          mkdir -p /tmp/kobon94-autolab
          cp /tmp/kobon94-tranche2-solution.json /tmp/kobon94-autolab/solution.json
          uv tool run --from hills==0.11.0 hills eval /tmp/kobon94-autolab -H kobon-triangles --current --json | tee /tmp/kobon94-autolab.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/kobon94-autolab.json").read_text())
          stack=[report]; score=None
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if x.get("name")=="triangles" and isinstance(x.get("value"),(int,float)):
                      score=x["value"]; break
                  stack.extend(x.values())
              elif isinstance(x,list):
                  stack.extend(x)
          if score is None or score < 94:
              raise SystemExit(f"AutoLab discrepancy: expected >=94, got {score}")
          print(f"H1_13_TRANCHE2_AUTOLAB_TRIANGLES={score}")
          print("H1_13_TRANCHE2_H1_07=PASS")
          PY
