name: NS-CI independent contribution intake

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ns-ci-contribution-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GCL-CONTRIB] ') &&
      startsWith(github.event.comment.body, 'GCL-CONTRIBUTION-RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Validate exact dispatch and result comment
        id: validate
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python ci/ns_ci_github_contribution_intake.py             --event "$GITHUB_EVENT_PATH"             --repo-root "$GITHUB_WORKSPACE"             --output "$OUT_DIR"

      - name: Report mechanical rejection
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python - <<'PY' > "$RUNNER_TEMP/rejection.md"
          from pathlib import Path
          import os
          error = (Path(os.environ["OUT_DIR"]) / "ERRORS.txt").read_text(encoding="utf-8").strip()
          print("INTAKE REJECTED — FORMAT")
          print()
          print(error)
          print()
          print("Submit one complete replacement GCL-CONTRIBUTION-RESULT/1 comment. Do not edit the rejected comment.")
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -F body=@"$RUNNER_TEMP/rejection.md"

      - name: Stop after rejection
        if: steps.validate.outcome == 'failure'
        run: exit 0

      - name: Load validated intake metadata
        if: steps.validate.outcome == 'success'
        id: meta
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads((Path(os.environ["OUT_DIR"]) / "META.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key in ("dispatch_id","comment_id","issue_number","raw_repo_path","receipt_repo_path","branch","pr_title"):
                  print(f"{key}={meta[key]}", file=f)
          PY

      - name: Inspect durable intake state
        if: steps.validate.outcome == 'success'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
        run: |
          raw_dir="$(dirname "$RAW_PATH")"
          if [ -d "$raw_dir" ] && find "$raw_dir" -maxdepth 1 -type f -name 'github-comment-*.md' -print -quit | grep -q .; then
            main_captured=true
          else
            main_captured=false
          fi

          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
          else
            branch_exists=false
          fi

          pr_url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          accepted_count="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100"             --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("INTAKE ACCEPTED — RAW EVIDENCE PR CREATED")))] | length')"

          echo "main_captured=$main_captured" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "accepted_count=$accepted_count" >> "$GITHUB_OUTPUT"

      - name: Report previously accepted result
        if: steps.validate.outcome == 'success' && steps.state.outputs.accepted_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ALREADY ACCEPTED — this dispatch already has an accepted raw-evidence intake. A second mathematical result comment is not admitted."

      - name: Report already protected result
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.accepted_count == '0' &&
          steps.state.outputs.main_captured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ALREADY PROTECTED — raw evidence for this dispatch is already present on protected main. No replacement result was admitted."

      - name: Report existing intake pull request
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.accepted_count == '0' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'true' &&
          steps.state.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.state.outputs.pr_url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ALREADY CAPTURED — the dispatch evidence branch already has an open raw-evidence PR: $PR_URL. No replacement result was admitted."

      - name: Recover missing intake pull request
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.accepted_count == '0' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'true' &&
          steps.state.outputs.pr_url == ''
        id: recovered_pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          PR_TITLE: ${{ steps.meta.outputs.pr_title }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
        run: |
          body="Recovered trusted intake snapshot for dispatch $DISPATCH_ID from its existing evidence branch. This PR preserves raw contributor evidence and a machine receipt only. It does not adjudicate mathematics, infer independence, certify a claim, or alter campaign state."
          url="$(gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report recovered intake
        if: steps.recovered_pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.recovered_pr.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE RECOVERED — an existing raw-evidence branch lacked an open PR; recovery opened: $PR_URL. No replacement result was admitted."

      - name: Snapshot first valid result and receipt
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.accepted_count == '0' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
          RECEIPT_PATH: ${{ steps.meta.outputs.receipt_repo_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
          COMMENT_ID: ${{ steps.meta.outputs.comment_id }}
        run: |
          git switch -c "$BRANCH"
          mkdir -p "$(dirname "$RAW_PATH")" "$(dirname "$RECEIPT_PATH")"
          cp "$OUT_DIR/RAW.md" "$RAW_PATH"
          cp "$OUT_DIR/RECEIPT.json" "$RECEIPT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RAW_PATH" "$RECEIPT_PATH"
          git commit -m "NS-CI intake: snapshot $DISPATCH_ID comment $COMMENT_ID"
          git push origin "$BRANCH"

      - name: Open first raw-evidence pull request
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.accepted_count == '0' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          PR_TITLE: ${{ steps.meta.outputs.pr_title }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
          COMMENT_ID: ${{ steps.meta.outputs.comment_id }}
        run: |
          body="Trusted intake snapshot for dispatch $DISPATCH_ID, GitHub comment $COMMENT_ID. This PR preserves raw contributor evidence and a machine receipt only. It does not adjudicate mathematics, infer independence, certify a claim, or alter campaign state."
          url="$(gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report accepted intake
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ACCEPTED — RAW EVIDENCE PR CREATED: $PR_URL. Mathematical status remains unadjudicated."
