name: NS-CI independent contribution intake

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ns-ci-contribution-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >
      !github.event.issue.pull_request &&
      (startsWith(github.event.issue.title, '[GCL-CONTRIB] NSCI-') ||
       startsWith(github.event.issue.title, '[GCL-CONTRIB] UC-001 UC-WP08-D004-') ||
       startsWith(github.event.issue.title, '[GCL-CONTRIB] CMDG-CM4 CMDG-P3M-SEP-') ||
       startsWith(github.event.issue.title, '[GCL-CONTRIB] CMDG-CM4 CMDG-P3M-COV-') ||
       startsWith(github.event.issue.title, '[GCL-CONTRIB] CMDG-CM4 CMDG-P3M-N3-') ||
       startsWith(github.event.issue.title, '[GCL-CONTRIB] ERDOS-OPEN ')) &&
      startsWith(github.event.comment.body, 'GCL-CONTRIBUTION-RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Fetch issue comment history
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add' > "$RUNNER_TEMP/issue-comments.json"

      - name: Validate exact dispatch and result comment
        id: validate
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python ci/ns_ci_github_contribution_intake.py             --event "$GITHUB_EVENT_PATH"             --repo-root "$GITHUB_WORKSPACE"             --output "$OUT_DIR"             --comments "$RUNNER_TEMP/issue-comments.json"

      - name: Report mechanical rejection
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python - <<'PY' > "$RUNNER_TEMP/rejection.md"
          from pathlib import Path
          import os
          error = (Path(os.environ["OUT_DIR"]) / "ERRORS.txt").read_text(encoding="utf-8").strip()
          print("INTAKE REJECTED — FORMAT")
          print()
          print(error)
          print()
          print("Submit one complete replacement GCL-CONTRIBUTION-RESULT/1 comment. Do not edit the rejected comment.")
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -F body=@"$RUNNER_TEMP/rejection.md"

      - name: Stop after rejection
        if: steps.validate.outcome == 'failure'
        run: exit 0

      - name: Load validated intake metadata
        if: steps.validate.outcome == 'success'
        id: meta
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads((Path(os.environ["OUT_DIR"]) / "META.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key in ("dispatch_id","comment_id","issue_number","raw_repo_path","receipt_repo_path","branch"):
                  print(f"{key}={meta[key]}", file=f)
          PY

      - name: Synchronize queue returned state
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
        run: |
          python ci/gcl_worker_queue_projection.py \
            --mode intake \
            --dispatch-id "$DISPATCH_ID" \
            > "$RUNNER_TEMP/queue-return-projection.json"

          if [ "$(jq -r '.queue_managed' "$RUNNER_TEMP/queue-return-projection.json")" != "true" ]; then
            exit 0
          fi

          if [ "$(jq '.issue_field_values | length' "$RUNNER_TEMP/queue-return-projection.json")" -gt 0 ]; then
            jq '{issue_field_values: .issue_field_values}' "$RUNNER_TEMP/queue-return-projection.json" > "$RUNNER_TEMP/queue-return-fields.json"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values" \
              --input "$RUNNER_TEMP/queue-return-fields.json" >/dev/null
          fi

          jq -r '.clear_field_ids[]?' "$RUNNER_TEMP/queue-return-projection.json" | while IFS= read -r field_id; do
            [ -z "$field_id" ] && continue
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values/$field_id" \
              >/dev/null 2>&1 || true
          done

          returned="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".gcl/worker_queue/CONFIG.json").read_text())["labels"]["returned"])
          PY
          )"
          available="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".gcl/worker_queue/CONFIG.json").read_text())["labels"]["available"])
          PY
          )"
          reserved="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".gcl/worker_queue/CONFIG.json").read_text())["labels"]["reserved"])
          PY
          )"

          gh label create "$returned" --repo "$GITHUB_REPOSITORY" --force >/dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$returned" >/dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$available" >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$reserved" >/dev/null 2>&1 || true

      - name: Inspect durable intake state
        if: steps.validate.outcome == 'success'
        id: state
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
        run: |
          raw_dir="$(dirname "$RAW_PATH")"
          if [ -d "$raw_dir" ] && find "$raw_dir" -maxdepth 1 -type f -name 'github-comment-*.md' -print -quit | grep -q .; then
            main_captured=true
          else
            main_captured=false
          fi

          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
          else
            branch_exists=false
          fi

          echo "main_captured=$main_captured" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"

      - name: Report already protected result
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ALREADY PROTECTED — raw evidence for this dispatch is already present on protected main. No replacement result was admitted."

      - name: Report already captured evidence branch
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE ALREADY CAPTURED — the dispatch evidence branch already exists. The bounded Release Trust PR controller owns PR creation. No replacement result was admitted."

      - name: Snapshot first valid result and receipt
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        env:
          OUT_DIR: ${{ runner.temp }}/ns-ci-intake
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
          RECEIPT_PATH: ${{ steps.meta.outputs.receipt_repo_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
          COMMENT_ID: ${{ steps.meta.outputs.comment_id }}
        run: |
          git switch -c "$BRANCH"
          mkdir -p "$(dirname "$RAW_PATH")" "$(dirname "$RECEIPT_PATH")"
          cp "$OUT_DIR/RAW.md" "$RAW_PATH"
          cp "$OUT_DIR/RECEIPT.json" "$RECEIPT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RAW_PATH" "$RECEIPT_PATH"
          git commit -m "CEI intake: snapshot $DISPATCH_ID comment $COMMENT_ID"
          git push origin "$BRANCH"

      - name: Report captured intake
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"             -f body="INTAKE CAPTURED — raw evidence and receipt were committed to the dispatch evidence branch. The bounded Release Trust PR controller will validate that branch and open the ordinary intake PR. Mathematical status remains unadjudicated."
