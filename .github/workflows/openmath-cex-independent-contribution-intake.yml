name: OPENMATH CEX independent contribution intake

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: openmath-cex-contribution-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GCL-CONTRIB] OPENMATH-2026 ') &&
      startsWith(github.event.comment.body, 'GCL-CONTRIBUTION-RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Validate exact dispatch and result comment
        id: validate
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}/openmath-cex-intake
        run: |
          python ci/openmath_cex_github_contribution_intake.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$OUT_DIR"

      - name: Report mechanical rejection
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUT_DIR: ${{ runner.temp }}/openmath-cex-intake
        run: |
          python - <<'PY' > "$RUNNER_TEMP/rejection.md"
          from pathlib import Path
          import os
          error = (Path(os.environ["OUT_DIR"]) / "ERRORS.txt").read_text(encoding="utf-8").strip()
          print("INTAKE REJECTED — FORMAT")
          print()
          print(error)
          print()
          print("Submit one complete replacement GCL-CONTRIBUTION-RESULT/1 comment. Do not edit the rejected comment.")
          PY
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -F body=@"$RUNNER_TEMP/rejection.md"

      - name: Stop after rejection
        if: steps.validate.outcome == 'failure'
        run: exit 0

      - name: Load validated intake metadata
        if: steps.validate.outcome == 'success'
        id: meta
        env:
          OUT_DIR: ${{ runner.temp }}/openmath-cex-intake
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads((Path(os.environ["OUT_DIR"]) / "META.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key in ("dispatch_id","comment_id","issue_number","raw_repo_path","receipt_repo_path","branch","pr_title"):
                  print(f"{key}={meta[key]}", file=f)
          PY

      - name: Inspect durable intake state
        if: steps.validate.outcome == 'success'
        id: state
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
        run: |
          if test -f "$RAW_PATH"; then
            main_captured=true
          else
            main_captured=false
          fi
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
          else
            branch_exists=false
          fi
          echo "main_captured=$main_captured" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"

      - name: Report already protected result
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE ALREADY PROTECTED — first valid evidence for this dispatch is already present on protected main. No replacement result was admitted."

      - name: Report already captured evidence branch
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE ALREADY CAPTURED — the first valid result already has an evidence branch. No replacement result was admitted."

      - name: Plan unattended lifecycle successor
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        env:
          OUT_DIR: ${{ runner.temp }}/openmath-cex-intake
        run: |
          python ci/openmath_lifecycle_candidate.py plan \
            --intake-dir "$OUT_DIR" \
            --output "$RUNNER_TEMP/openmath-lifecycle-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "openmath-lifecycle-plan.json").read_text(encoding="utf-8"))
          (Path(os.environ["RUNNER_TEMP"]) / "openmath-successor-body.md").write_text(plan["issue_body"], encoding="utf-8")
          (Path(os.environ["RUNNER_TEMP"]) / "openmath-successor-title.txt").write_text(plan["issue_title"], encoding="utf-8")
          PY

      - name: Create bounded successor return surface
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        id: successor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat "$RUNNER_TEMP/openmath-successor-title.txt")"
          gh api "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$title" \
            -F body=@"$RUNNER_TEMP/openmath-successor-body.md" \
            > "$RUNNER_TEMP/openmath-successor-issue.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          issue = json.loads((Path(os.environ["RUNNER_TEMP"]) / "openmath-successor-issue.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"number={issue['number']}", file=f)
              print(f"url={issue['html_url']}", file=f)
          PY

      - name: Build returned-to-advanced lifecycle candidate
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false'
        id: lifecycle
        env:
          OUT_DIR: ${{ runner.temp }}/openmath-cex-intake
          BRANCH: ${{ steps.meta.outputs.branch }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
          SUCCESSOR_ISSUE: ${{ steps.successor.outputs.number }}
          SUCCESSOR_URL: ${{ steps.successor.outputs.url }}
        run: |
          git switch -c "$BRANCH"
          python ci/openmath_lifecycle_candidate.py apply \
            --repo-root "$GITHUB_WORKSPACE" \
            --intake-dir "$OUT_DIR" \
            --issue-number "$SUCCESSOR_ISSUE" \
            --issue-url "$SUCCESSOR_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OPENMATH lifecycle: advance $DISPATCH_ID through adjudication"
          content_commit="$(git rev-parse HEAD)"
          python ci/openmath_lifecycle_candidate.py finalize-pin \
            --repo-root "$GITHUB_WORKSPACE" \
            --dispatch-id "$DISPATCH_ID" \
            --content-commit "$content_commit"
          git add -A
          git commit -m "OPENMATH lifecycle: pin successor task for $DISPATCH_ID"
          git push origin "$BRANCH"

      - name: Close orphan successor if lifecycle construction fails
        if: >
          failure() &&
          steps.successor.outputs.number != '' &&
          steps.state.outputs.branch_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESSOR_ISSUE: ${{ steps.successor.outputs.number }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$SUCCESSOR_ISSUE" -f state=closed \
            -f state_reason=not_planned >/dev/null

      - name: Report lifecycle candidate captured
        if: >
          steps.validate.outcome == 'success' &&
          steps.state.outputs.main_captured == 'false' &&
          steps.state.outputs.branch_exists == 'false' &&
          steps.lifecycle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="LIFECYCLE CANDIDATE CAPTURED — the validated return has been carried through CAPTURED → REPLAYED → ADJUDICATED → ADVANCED on the protected candidate branch. Release Trust now owns protected merge and Programme projection. No manual evidence relay or controller prompt is required."
