name: OPENMATH Kobon baseline gate

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - ".github/workflows/openmath-kobon-baseline-gate.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-baseline-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Independent exact scorer tests
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python -m unittest -v test_kobon_scorer.py

      - name: Independent exact baseline receipt
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python kobon_scorer.py baseline/solution.json \
            --n 18 \
            --expect 16 \
            --output /tmp/gcl-kobon-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("/tmp/gcl-kobon-baseline.json").read_text())
          assert result["triangles"] == 16
          assert [f["supporting_lines"] for f in result["faces"]] == [
              [i, i+1, i+2] for i in range(16)
          ]
          print("GCL_EXACT_TRIANGLES=16")
          print("GCL_SOLUTION_SHA256="+result["solution_sha256"])
          print("GCL_ARRANGEMENT_VERTICES="+str(result["arrangement_vertices"]))
          print("GCL_BOUNDED_EDGES="+str(result["bounded_arrangement_edges"]))
          PY

      - name: Install pinned uv launcher
        run: |
          python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Install official AutoLab CLI
        run: |
          curl -fsSL https://app.autolab.ai/install.sh -o /tmp/autolab-install.sh
          sha256sum /tmp/autolab-install.sh
          sh /tmp/autolab-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/autolab" --version

      - name: Authenticate AutoLab
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        run: |
          if [ -z "$AUTOLAB_TOKEN" ]; then
            echo "AUTOLAB_AUTH_BLOCKER=repository secret AUTOLAB_TOKEN is unavailable"
            exit 42
          fi
          "$HOME/.local/bin/autolab" login --token "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" whoami

      - name: Pull public Kobon hill
        run: |
          "$HOME/.local/bin/autolab" hills pull alejandrozu/kobon-triangles
          uv tool run --from hills==0.11.0 hills describe kobon-triangles

      - name: AutoLab Hills evaluator cross-check
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -o pipefail
          uv tool run --from hills==0.11.0 hills eval baseline \
            -H kobon-triangles \
            --current \
            --json \
            | tee /tmp/autolab-kobon-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path("/tmp/autolab-kobon-baseline.json").read_text())

          def find_triangle_metric(value):
              if isinstance(value, dict):
                  if value.get("name") == "triangles" and isinstance(value.get("value"), (int, float)):
                      return value["value"]
                  for item in value.values():
                      found=find_triangle_metric(item)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for item in value:
                      found=find_triangle_metric(item)
                      if found is not None:
                          return found
              return None

          triangles=find_triangle_metric(report)
          if triangles is None:
              raise SystemExit("AutoLab report contains no triangles metric")
          if triangles != 16:
              raise SystemExit(f"AUTOLAB DISCREPANCY: expected 16 triangles, got {triangles}")
          print("AUTOLAB_TRIANGLES=16")
          print("AUTOLAB_BASELINE_CONCORDANCE=PASS")
          PY
