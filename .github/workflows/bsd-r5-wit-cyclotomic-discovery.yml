name: BSD R5-WIT cyclotomic discovery

on:
  push:
    branches:
      - solve/bsd-r5-wit-normalized-kurihara-witness
    paths:
      - 'work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/04_CYCLOTOMIC_MAZUR_TATE_DISCOVERY.gp'
      - '.github/workflows/bsd-r5-wit-cyclotomic-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclotomic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact PARI GP 2.15.4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pari-gp
          gp --version 2>&1 | grep -F '2.15.4'

      - name: Exact cyclotomic Mazur-Tate residual scan
        shell: bash
        run: |
          set -euo pipefail
          gp -f -q < work_packages/BSD_R5_WIT_NORMALIZED_KURIHARA_WITNESS/04_CYCLOTOMIC_MAZUR_TATE_DISCOVERY.gp
