name: OPENMATH H1 Agent 001 adjudication

on:
  pull_request:
    paths:
      - "contributions/OPENMATH-2026/OM26-H1/H1-12/adjudications/**"
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/H1_12_STATUS.json"
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/CLAIM_LEDGER.json"
      - ".gcl/campaigns/OPENMATH-2026/CEX_ASSIGNMENTS.json"
      - "work_packages/OPENMATH_2026/HILL_LANES.json"
      - ".gcl/operations/OM26-H1-H1-12-ADJ-001/**"
      - ".gcl/admission/OM26-H1-H1-12-ADJ-001/**"
      - "ci/validate_openmath_h1_agent001_adjudication.py"
      - ".github/workflows/openmath-h1-agent001-adjudication.yml"
      - ".ghos-routing/workflows.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Replay and validate adjudication
        run: python ci/validate_openmath_h1_agent001_adjudication.py
