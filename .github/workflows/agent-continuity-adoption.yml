name: Agent continuity adoption

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".gcl/agent-continuity.json"
      - "scripts/validate_agent_continuity_adoption.py"
      - ".github/workflows/agent-continuity-adoption.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".gcl/agent-continuity.json"
      - "scripts/validate_agent_continuity_adoption.py"
      - ".github/workflows/agent-continuity-adoption.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate continuity adoption
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_agent_continuity_adoption.py
