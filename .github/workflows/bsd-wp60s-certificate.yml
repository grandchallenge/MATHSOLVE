name: BSD WP60S inverse-limit theorem replay

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R2_A1_WP60S_BSS_INVERSE_LIMIT/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-WP60S/**'
      - '.gcl/admission/BSD-WP60S/**'
      - '.gcl/completions/BSD-WP60S/**'
      - 'tools/gcl_campaign_preflight.py'
      - 'tools/gcl_completion_receipt_validate.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-wp60s-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R2_A1_WP60S_BSS_INVERSE_LIMIT/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-WP60S/**'
      - '.gcl/admission/BSD-WP60S/**'
      - '.gcl/completions/BSD-WP60S/**'
      - 'tools/gcl_campaign_preflight.py'
      - 'tools/gcl_completion_receipt_validate.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-wp60s-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-theorem-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate WP60S historical or current execution state
        shell: bash
        run: |
          current=$(python -c "import json; print(json.load(open('.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'))['current_operation'])")
          if [ "$current" = "BSD-WP60S" ]; then
            python tools/gcl_campaign_preflight.py BSD-001 BSD-WP60S
          else
            python tools/gcl_completion_receipt_validate.py
          fi
      - name: Replay protected WP60R dependency certificate
        run: python work_packages/BSD_R2_A1_WP60R_BSS_THEOREM_REPLAY/04_DEPENDENCY_REPLAY_CERTIFICATE.py
      - name: Replay WP60S inverse-limit certificate
        run: python work_packages/BSD_R2_A1_WP60S_BSS_INVERSE_LIMIT/04_INVERSE_LIMIT_REPLAY_CERTIFICATE.py
      - name: Assert protected WP60S disposition and firewalls
        shell: bash
        run: |
          ledger=work_packages/BSD_R2_A1_WP60S_BSS_INVERSE_LIMIT/03_CLAIM_LEDGER.yaml
          grep -q 'BSS_LITERAL_P2_SELECTED_THEOREM_5_25_REPLAYED' "$ledger"
          grep -q 'formal_higher_level_hypothesis_3_2_iii: false' "$ledger"
          grep -q 'full_bss_hypothesis_4_7: false' "$ledger"
          grep -q 'bss_hypothesis_4_7_iii: false' "$ledger"
          grep -q 'infinite_bss_h3: false' "$ledger"
          grep -q 'bsd_r2_a1: false' "$ledger"
          grep -q 'mathcert_certification: false' "$ledger"
