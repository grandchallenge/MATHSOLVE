name: OTP B1 Binary Codes successor handoff

on:
  pull_request:
    paths:
      - 'work_packages/OPENAI_TEN_PROOFS_WP00/result_family_handoff_successors/OTP-B1-BINARY-CODES.json'
      - 'schemas/openai_ten_proofs_b1_binary_codes_handoff.schema.json'
      - 'ci/validate_otp_b1_binary_codes_handoff.py'
      - 'tests/test_otp_b1_binary_codes_handoff.py'
      - '.github/workflows/otp-b1-binary-codes-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate B1 successor handoff contract
        run: |
          python ci/validate_otp_b1_binary_codes_handoff.py
          python -m unittest tests/test_otp_b1_binary_codes_handoff.py -v
          python -m json.tool schemas/openai_ten_proofs_b1_binary_codes_handoff.schema.json > /dev/null
          python -m json.tool work_packages/OPENAI_TEN_PROOFS_WP00/result_family_handoff_successors/OTP-B1-BINARY-CODES.json > /dev/null
