name: UC WP08 closure-system replay

on:
  pull_request:
    paths:
      - 'MathSolve/UnionClosed/FunctionalPreorderP04.lean'
      - 'MathSolve/UnionClosed/PosetIdealP04.lean'
      - 'MathSolve/UnionClosed/ClosureImplicationP04.lean'
      - 'MathSolve/UnionClosed/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'ci/checked_lean.py'
      - 'domains/union_closed/WP08_closure_system_bridge/**'
      - 'handoffs/UC-001/**'
      - '.github/workflows/uc-wp08-closure-system.yml'
  push:
    branches: [main]
    paths:
      - 'MathSolve/UnionClosed/FunctionalPreorderP04.lean'
      - 'MathSolve/UnionClosed/PosetIdealP04.lean'
      - 'MathSolve/UnionClosed/ClosureImplicationP04.lean'
      - 'MathSolve/UnionClosed/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'ci/checked_lean.py'
      - 'domains/union_closed/WP08_closure_system_bridge/**'
      - 'handoffs/UC-001/**'
      - '.github/workflows/uc-wp08-closure-system.yml'

permissions:
  contents: read

jobs:
  local-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: grandchallenge/lean-action@f58ea9134a76be187238e5458998cc0ffffe3f6c
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
      - name: Replay WP08 theorem surface
        run: |
          set -euo pipefail
          python ci/checked_lean.py -- lake build MathSolve.UnionClosed.FunctionalPreorderP04 MathSolve.UnionClosed.PosetIdealP04 MathSolve.UnionClosed.ClosureImplicationP04
          python ci/checked_lean.py -- lake env lean MathSolve/UnionClosed/FunctionalPreorderP04.lean
          python ci/checked_lean.py -- lake env lean MathSolve/UnionClosed/PosetIdealP04.lean
          python ci/checked_lean.py -- lake env lean MathSolve/UnionClosed/ClosureImplicationP04.lean
          for f in \
            MathSolve/UnionClosed/FunctionalPreorderP04.lean \
            MathSolve/UnionClosed/PosetIdealP04.lean \
            MathSolve/UnionClosed/ClosureImplicationP04.lean
          do
            if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' "$f"; then
              echo "proof placeholder found in $f" >&2
              exit 1
            fi
            if grep -nE '^[[:space:]]*axiom[[:space:]]' "$f"; then
              echo "explicit axiom found in $f" >&2
              exit 1
            fi
          done
