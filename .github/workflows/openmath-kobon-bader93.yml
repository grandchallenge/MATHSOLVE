name: OPENMATH Kobon Bader 93 reconstruction

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - "work_packages/OPENMATH_2026/CONTEST_CANDIDATES/**"
      - "work_packages/OPENMATH_2026/OM26_H4_COLLATZ_MODULAR_DESCENT/**"
      - "work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/**"
      - ".github/workflows/openmath-kobon-bader93.yml"
      - ".ghos-routing/workflows.json"

permissions:
  contents: read

jobs:
  exact-reconstruction-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify exact published order table
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python verify_bader_93_order.py BADER_93_ORDER_TABLE.json candidates/RH_BADER_RECONSTRUCTION_093/solution.json

      - name: Independent direct oracle replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python kobon_direct_oracle.py candidates/RH_BADER_RECONSTRUCTION_093/solution.json --n 18 --expect 93 --output /tmp/bader93-oracle.json



  h4-trusted-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Independent exact H4 replay
        run: |
          python work_packages/OPENMATH_2026/OM26_H4_COLLATZ_MODULAR_DESCENT/trusted_replay_h4.py
          python work_packages/OPENMATH_2026/OM26_H4_COLLATZ_MODULAR_DESCENT/trusted_replay_h4_extended.py

  h7-pinned-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact proof candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pull exact organizer-pinned Lean image
        run: docker pull ghcr.io/ottogin/lean-mathlib@sha256:964547ad81e109c78545512867bae70b710c55d833078674878faad7de0ebb85
      - name: Compile H7-D3 and H7-D4 with no proof holes
        run: |
          docker run --rm \
            -v "$PWD/work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/H7_D3.lean:/tmp/H7_D3.lean:ro" \
            -v "$PWD/work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/H7_D4.lean:/tmp/H7_D4.lean:ro" \
            -v "$PWD/work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/H7_D5.lean:/tmp/H7_D5.lean:ro" \
            ghcr.io/ottogin/lean-mathlib@sha256:964547ad81e109c78545512867bae70b710c55d833078674878faad7de0ebb85 \
            bash -lc 'set -euo pipefail; cd /opt/formal-conjectures; lean --version; libs=(.lake/build/lib/lean); for d in .lake/packages/*/.lake/build/lib/lean; do if [ -d "$d" ]; then libs+=("$d"); fi; done; export LEAN_PATH="$(IFS=:; echo "${libs[*]}")"; printf "LEAN_PATH=%s\\n" "$LEAN_PATH"; lean /tmp/H7_D3.lean; lean /tmp/H7_D4.lean; lean /tmp/H7_D5.lean'
