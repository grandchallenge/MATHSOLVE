name: OPENMATH Kobon Bader 93 reconstruction

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - ".github/workflows/openmath-kobon-bader93.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:
    inputs:
      submit_to_leaderboard:
        description: Submit the validated 93-triangle reconstruction as jimsteeg
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  exact-reconstruction-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify exact published order table
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python verify_bader_93_order.py BADER_93_ORDER_TABLE.json candidates/RH_BADER_RECONSTRUCTION_093/solution.json

      - name: Independent direct oracle replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python kobon_direct_oracle.py candidates/RH_BADER_RECONSTRUCTION_093/solution.json --n 18 --expect 93 --output /tmp/bader93-oracle.json

      - name: Install pinned uv launcher
        run: python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Install official AutoLab CLI
        run: |
          curl -fsSL https://app.autolab.ai/install.sh -o /tmp/autolab-install.sh
          sha256sum /tmp/autolab-install.sh
          sh /tmp/autolab-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate AutoLab
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        run: |
          if [ -z "$AUTOLAB_TOKEN" ]; then exit 42; fi
          "$HOME/.local/bin/autolab" login --token "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" whoami

      - name: Pull public Kobon hill
        run: |
          "$HOME/.local/bin/autolab" hills pull alejandrozu/kobon-triangles
          uv tool run --from hills==0.11.0 hills describe kobon-triangles

      - name: AutoLab exact replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -o pipefail
          uv tool run --from hills==0.11.0 hills eval candidates/RH_BADER_RECONSTRUCTION_093 -H kobon-triangles --current --json | tee /tmp/bader93-autolab.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/bader93-autolab.json").read_text())
          stack=[report]; score=None
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if x.get("name")=="triangles" and isinstance(x.get("value"),(int,float)):
                      score=x["value"]; break
                  stack.extend(x.values())
              elif isinstance(x,list): stack.extend(x)
          if score != 93:
              raise SystemExit(f"AutoLab discrepancy: expected 93, got {score}")
          print("RH_BADER93_AUTOLAB_TRIANGLES=93")
          print("RH_BADER93_H1_07=PASS")
          PY

      - name: Submit validated reconstruction to the live hill
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_leaderboard
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -euo pipefail
          "$HOME/.local/bin/autolab" whoami > /tmp/gcl-autolab-identity.txt
          python - <<'PYID'
          from pathlib import Path
          import re
          identity=Path('/tmp/gcl-autolab-identity.txt').read_text()
          if not re.search(r'(?m)^nickname:\s+jimsteeg\s*$',identity):
              raise SystemExit('Submission refused: expected AutoLab account jimsteeg')
          print('SUBMISSION_ACCOUNT=jimsteeg')
          PYID
          uv tool run --from hills==0.11.0 hills eval candidates/RH_BADER_RECONSTRUCTION_093 -H kobon-triangles --final -o /tmp/gcl-h1-report.json --json > /tmp/gcl-h1-eval-output.json
          python - <<'PYREPORT'
          import json
          report=json.load(open('/tmp/gcl-h1-report.json'))
          stack=[report]; scores=[]
          while stack:
              item=stack.pop()
              if isinstance(item,dict):
                  if item.get('name')=='triangles': scores.append(item.get('value'))
                  stack.extend(item.values())
              elif isinstance(item,list): stack.extend(item)
          if scores != [93]: raise SystemExit('Submission refused: report is not exactly 93 triangles')
          if not report.get('tree_hash') or not report.get('official'):
              raise SystemExit('Submission refused: evaluator did not produce an official committed-version report')
          print('SUBMISSION_TRIANGLES=93')
          PYREPORT
          # This CLI submission performs an external write equivalent to -X POST.
          "$HOME/.local/bin/autolab" hills submit /tmp/gcl-h1-report.json --hill alejandrozu/kobon-triangles | tee /tmp/gcl-h1-submission.txt

      - name: Preserve evaluation and submission response
        if: always() && github.event_name == 'workflow_dispatch' && inputs.submit_to_leaderboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl-h1-submission-${{ github.run_id }}
          path: |
            /tmp/gcl-h1-report.json
            /tmp/gcl-h1-submission.txt
          if-no-files-found: warn
