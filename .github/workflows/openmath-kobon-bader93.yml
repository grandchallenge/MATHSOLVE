name: OPENMATH Kobon Bader 93 reconstruction

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - "work_packages/OPENMATH_2026/CONTEST_CANDIDATES/**"
      - ".github/workflows/openmath-kobon-bader93.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:
    inputs:
      submit_to_leaderboard:
        description: Register fixed H1 H2 H4 H5 H6 candidates as jimsteeg
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  exact-reconstruction-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify exact published order table
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python verify_bader_93_order.py BADER_93_ORDER_TABLE.json candidates/RH_BADER_RECONSTRUCTION_093/solution.json

      - name: Independent direct oracle replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python kobon_direct_oracle.py candidates/RH_BADER_RECONSTRUCTION_093/solution.json --n 18 --expect 93 --output /tmp/bader93-oracle.json

      - name: Install pinned uv launcher
        run: python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Install official AutoLab CLI
        run: |
          curl -fsSL https://app.autolab.ai/install.sh -o /tmp/autolab-install.sh
          sha256sum /tmp/autolab-install.sh
          sh /tmp/autolab-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate AutoLab
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        run: |
          if [ -z "$AUTOLAB_TOKEN" ]; then exit 42; fi
          "$HOME/.local/bin/autolab" login --token "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" whoami

      - name: Read-only AutoLab leaderboard route probe
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          "$HOME/.local/bin/autolab" hills submit --help
          python probe_autolab_leaderboard_route.py

      - name: Execute existing fixed H1 job on our own ephemeral compute
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
          PROJECT: jimsteeg/gcl-2026-h1-fixed-e606799ad6c1
          JOB_ID: 5c6779f5-5f3d-474c-9cf8-310a0d679efb
          NODE_NAME: gcl-h1-${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base="https://app.autolab.ai"
          token=os.environ["AUTOLAB_TOKEN"]
          project=os.environ["PROJECT"]
          job_id=os.environ["JOB_ID"]
          def get(path):
              req=urllib.request.Request(base+path,headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read())
          p=get("/api/v1/projects/"+project)
          if float((p.get("termination") or {}).get("max_cost_usd",-1)) != 0.0:
              raise SystemExit("Refusing: H1 model budget is not exactly $0")
          if (p.get("compute_rental") or {}).get("limits"):
              raise SystemExit("Refusing: H1 has nonempty AutoLab rental limits")
          if p.get("hill",{}).get("tree_hash") != "7d3f1d91dcb8be8d0eef20be763557bd6d876707":
              raise SystemExit("Refusing: H1 hill version drift")
          jobs=get("/api/v1/projects/"+project+"/jobs").get("items",[])
          j=next((x for x in jobs if x.get("id")==job_id),None)
          if not j:
              raise SystemExit("Refusing: exact H1 job not found")
          if j.get("status") not in {"queued","completed"}:
              raise SystemExit("Refusing: unexpected H1 job state "+str(j.get("status")))
          print("PRECHECK=PASS budget=$0 rentals=empty exact_hill=yes job_status="+j.get("status",""))
          PY

          cleanup() {
            "$HOME/.local/bin/autolab" nodes detach "$NODE_NAME" --project "$PROJECT" || true
            "$HOME/.local/bin/autolab" serve stop --name "$NODE_NAME" || true
          }
          trap cleanup EXIT

          "$HOME/.local/bin/autolab" serve --daemon --name "$NODE_NAME"
          sleep 3
          "$HOME/.local/bin/autolab" serve status --all
          "$HOME/.local/bin/autolab" nodes attach "$NODE_NAME" --project "$PROJECT"

          python - <<'PY'
          import json, os, time, urllib.request
          base="https://app.autolab.ai"
          token=os.environ["AUTOLAB_TOKEN"]; project=os.environ["PROJECT"]; job_id=os.environ["JOB_ID"]
          def get(path):
              req=urllib.request.Request(base+path,headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read())
          deadline=time.time()+420
          last=None
          while time.time()<deadline:
              items=get("/api/v1/projects/"+project+"/jobs").get("items",[])
              j=next(x for x in items if x.get("id")==job_id)
              state=j.get("status")
              if state != last:
                  print("H1_JOB_STATUS="+str(state), flush=True); last=state
              if state in {"completed","failed","cancelled"}:
                  out={k:j.get(k) for k in ("id","status","commit_sha","result","eval","error_message","started_at","completed_at")}
                  print("H1_JOB_FINAL="+json.dumps(out,sort_keys=True), flush=True)
                  if state!="completed":
                      raise SystemExit("H1 fixed job did not complete")
                  break
              time.sleep(5)
          else:
              raise SystemExit("H1 fixed job did not finish within bounded runner window")
          PY

          python - <<'PY'
          import json, os, urllib.request
          base="https://app.autolab.ai"; token=os.environ["AUTOLAB_TOKEN"]
          req=urllib.request.Request(base+"/api/v1/hills/alejandrozu/kobon-triangles/leaderboard",headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r: board=json.loads(r.read())
          hits=[]
          for g in board.get("groups",[]):
              for e in g.get("entries",[]):
                  if e.get("owner")=="jimsteeg":
                      hits.append({"label":g.get("label"),"entry":e})
          print("JIMSTEEG_LEADERBOARD="+json.dumps(hits,sort_keys=True))
          PY

      - name: Pull public Kobon hill
        run: |
          "$HOME/.local/bin/autolab" hills pull alejandrozu/kobon-triangles
          uv tool run --from hills==0.11.0 hills describe kobon-triangles

      - name: AutoLab exact replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -o pipefail
          uv tool run --from hills==0.11.0 hills eval candidates/RH_BADER_RECONSTRUCTION_093 -H kobon-triangles --current --json | tee /tmp/bader93-autolab.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/bader93-autolab.json").read_text())
          stack=[report]; score=None
          while stack:
              x=stack.pop()
              if isinstance(x,dict):
                  if x.get("name")=="triangles" and isinstance(x.get("value"),(int,float)):
                      score=x["value"]; break
                  stack.extend(x.values())
              elif isinstance(x,list): stack.extend(x)
          if score != 93:
              raise SystemExit(f"AutoLab discrepancy: expected 93, got {score}")
          print("RH_BADER93_AUTOLAB_TRIANGLES=93")
          print("RH_BADER93_H1_07=PASS")
          PY

      - name: Register fixed payloads in native AutoLab Climbs
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_leaderboard
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -euo pipefail
          "$HOME/.local/bin/autolab" whoami > /tmp/gcl-autolab-identity.txt
          python - <<'PYID'
          from pathlib import Path
          import re
          identity=Path('/tmp/gcl-autolab-identity.txt').read_text()
          if not re.search(r'(?m)^nickname:\s+jimsteeg\s*$',identity):
              raise SystemExit('Submission refused: expected AutoLab account jimsteeg')
          print('SUBMISSION_ACCOUNT=jimsteeg')
          PYID
          # Native Climb registration performs an external write equivalent to -X POST.
          python submit_fixed_climb.py

      - name: Preserve evaluation and submission response
        if: always() && github.event_name == 'workflow_dispatch' && inputs.submit_to_leaderboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl-h1-submission-${{ github.run_id }}
          path: |
            /tmp/gcl-native-submissions.json
            /tmp/gcl-h1-eval-output.json
            /tmp/bader93-autolab.json
          if-no-files-found: warn
