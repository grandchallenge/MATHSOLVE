name: BSD R5-RES residual detection certificate

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R5_RES_RESIDUAL_KATO_NONVANISHING/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-RES/**'
      - '.gcl/admission/BSD-R5-RES/**'
      - '.gcl/completions/BSD-R5-RES/**'
      - 'tools/gcl_campaign_preflight_r5_res.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-r5-res-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R5_RES_RESIDUAL_KATO_NONVANISHING/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-RES/**'
      - '.gcl/admission/BSD-R5-RES/**'
      - '.gcl/completions/BSD-R5-RES/**'
      - 'tools/gcl_campaign_preflight_r5_res.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.ghos-routing/workflows.json'
      - '.github/workflows/bsd-r5-res-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-detection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate current or historical operation state
        shell: bash
        run: |
          current=$(python -c "import json; print(json.load(open('.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'))['current_operation'])")
          if [ "$current" = "BSD-R5-RES" ]; then
            python tools/gcl_campaign_preflight_r5_res.py BSD-001 BSD-R5-RES
          else
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-RES
          fi
      - name: Replay protected R5-PRIM residual algebra certificate
        run: python work_packages/BSD_R5_PRIM_DETERMINANTAL_PRIMITIVITY/04_RESIDUAL_ALGEBRA_CERTIFICATE.py
      - name: Replay protected WP60T derivative certificate
        run: python work_packages/BSD_R2_A1_WP60T_BSS_DERIVATIVE_APPLICATION/04_DERIVATIVE_REPLAY_CERTIFICATE.py
      - name: Check finite detection and local-factor algebra
        run: python work_packages/BSD_R5_RES_RESIDUAL_KATO_NONVANISHING/04_RESIDUAL_DETECTION_CERTIFICATE.py
      - name: Assert blocked boundary and claim firewall
        shell: bash
        run: |
          ledger=work_packages/BSD_R5_RES_RESIDUAL_KATO_NONVANISHING/03_CLAIM_LEDGER.yaml
          grep -q 'BSD-R5-RES-FINITE-DETECT-002' "$ledger"
          grep -q 'BSD-R5-RES-BOUNDARY-005' "$ledger"
          grep -q 'MISSING_P2_NORMALIZED_ANOMALOUS_ORDINARY_KATO_KURIHARA_RECIPROCITY' "$ledger"
          grep -q 'candidate_disposition: BLOCKED' "$ledger"
          grep -q 'r5_lift: true' "$ledger"
          grep -q 'r5_prim: false' "$ledger"
          grep -q 'r5_res: false' "$ledger"
          grep -q 'bsd_r2_a1: false' "$ledger"
          grep -q 'mathcert_certification: false' "$ledger"
      - name: Validate completion receipt when present
        shell: bash
        run: |
          receipt=.gcl/completions/BSD-R5-RES/COMPLETION_RECEIPT.json
          if test -f "$receipt"; then
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-RES
          fi
