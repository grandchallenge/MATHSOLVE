name: GCL queue-class semantic contract
on:
  pull_request:
    paths:
      - "WORKERS.md"
      - ".well-known/gcl-worker-queue.json"
      - "ci/gcl_queue_class_contract.py"
      - "ci/test_gcl_queue_class_contract.py"
      - "docs/GCL_SPECIALIZED_QUEUES.md"
      - ".github/workflows/gcl-queue-class-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate bootstrap and protected Project routing
        run: |
          python3 ci/validate_gcl_worker_bootstrap.py
          python3 ci/validate_gcl_worker_queue_project.py
      - name: Positive and hostile class-capacity replay
        run: python3 -m unittest discover -s ci -p 'test_gcl_queue_class_contract.py' -v
