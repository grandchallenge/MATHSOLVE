name: BSD WP60J certificate

on:
  pull_request:
    paths:
      - "work_packages/BSD_R2_A1_WP60J_BSS_RESIDUAL_HYP32/**"
      - "handoffs/BSD-001/WP60J_FRONTIER.md"
      - ".github/workflows/bsd-wp60j-certificate.yml"
  push:
    branches: [main]
    paths:
      - "work_packages/BSD_R2_A1_WP60J_BSS_RESIDUAL_HYP32/**"
      - "handoffs/BSD-001/WP60J_FRONTIER.md"
      - ".github/workflows/bsd-wp60j-certificate.yml"

permissions:
  contents: read

jobs:
  exact-residual-cohomology:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Replay residual H1 certificate
        run: python work_packages/BSD_R2_A1_WP60J_BSS_RESIDUAL_HYP32/02_RESIDUAL_COHOMOLOGY_CERTIFICATE.py
