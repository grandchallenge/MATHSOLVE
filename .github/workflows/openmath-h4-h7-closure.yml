name: OPENMATH H4 H7 closure

on:
  push:
    branches:
      - openmath/h4-h7-closure-2026-10-01
    paths:
      - "work_packages/OPENMATH_2026/OM26_H4_COLLATZ_MODULAR_DESCENT/**"
      - "work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/**"
      - ".github/workflows/openmath-h4-h7-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h4-trusted-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact H4 replay
        run: python work_packages/OPENMATH_2026/OM26_H4_COLLATZ_MODULAR_DESCENT/trusted_replay_h4.py

  h7-pinned-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull exact organizer-pinned Lean image
        run: docker pull ghcr.io/ottogin/lean-mathlib@sha256:964547ad81e109c78545512867bae70b710c55d833078674878faad7de0ebb85
      - name: Compile H7-D3 with no proof holes
        run: |
          docker run --rm \
            -v "$PWD/work_packages/OPENMATH_2026/OM26_H7_ERDOS_3/H7_D3.lean:/tmp/H7_D3.lean:ro" \
            ghcr.io/ottogin/lean-mathlib@sha256:964547ad81e109c78545512867bae70b710c55d833078674878faad7de0ebb85 \
            bash -lc 'cd /opt/formal-conjectures && lean --version && lake env lean /tmp/H7_D3.lean'
