name: OTP G Quantum Parallel Repetition successor handoff

on:
  pull_request:
    paths:
      - 'work_packages/OPENAI_TEN_PROOFS_WP00/result_family_handoff_successors/OTP-G-QUANTUM-PARALLEL-REPETITION.json'
      - 'schemas/openai_ten_proofs_g_quantum_parallel_repetition_handoff.schema.json'
      - 'ci/validate_otp_g_quantum_parallel_repetition_handoff.py'
      - 'tests/test_otp_g_quantum_parallel_repetition_handoff.py'
      - '.github/workflows/otp-g-quantum-parallel-repetition-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject checkout
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate G successor handoff contract
        shell: bash
        run: |
          python ci/validate_otp_g_quantum_parallel_repetition_handoff.py
          python -m unittest tests/test_otp_g_quantum_parallel_repetition_handoff.py -v
          python -m json.tool schemas/openai_ten_proofs_g_quantum_parallel_repetition_handoff.schema.json > /dev/null
          python -m json.tool work_packages/OPENAI_TEN_PROOFS_WP00/result_family_handoff_successors/OTP-G-QUANTUM-PARALLEL-REPETITION.json > /dev/null
