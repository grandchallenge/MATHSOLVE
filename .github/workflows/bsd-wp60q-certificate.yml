name: BSD WP60Q selected residual core graph

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R2_A1_WP60Q_SELECTED_P2_CORE_GRAPH/**'
      - 'handoffs/BSD-001/WP60Q_FRONTIER.md'
      - 'handoffs/BSD-001/README.md'
      - '.github/workflows/bsd-wp60q-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R2_A1_WP60Q_SELECTED_P2_CORE_GRAPH/**'
      - 'handoffs/BSD-001/WP60Q_FRONTIER.md'
      - 'handoffs/BSD-001/README.md'
      - '.github/workflows/bsd-wp60q-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-selected-prerequisites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Replay WP60J residual cohomology certificate
        run: python work_packages/BSD_R2_A1_WP60J_BSS_RESIDUAL_HYP32/02_RESIDUAL_COHOMOLOGY_CERTIFICATE.py
      - name: Replay WP60N characteristic-two exchange certificate
        run: python work_packages/BSD_R2_A1_WP60N_COISOTROPIC_P2_CONNECTIVITY/02_EXCHANGE_RELATION_CERTIFICATE.py
      - name: Assert selected application disposition and firewall
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BSS_LITERAL_P2_SELECTED_RESIDUAL_CORE_GRAPH_CONNECTED' work_packages/BSD_R2_A1_WP60Q_SELECTED_P2_CORE_GRAPH/01_SELECTED_RESIDUAL_CORE_GRAPH_THEOREM.md
          grep -q 'MISSING_LITERAL_P2_BSS_THEOREM_5_20_5_2_REPLAY_AFTER_REPLACEMENTS' work_packages/BSD_R2_A1_WP60Q_SELECTED_P2_CORE_GRAPH/01_SELECTED_RESIDUAL_CORE_GRAPH_THEOREM.md
          grep -q 'bss_theorem_5_20: false' work_packages/BSD_R2_A1_WP60Q_SELECTED_P2_CORE_GRAPH/03_CLAIM_LEDGER.yaml
