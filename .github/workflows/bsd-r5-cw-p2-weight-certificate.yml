name: BSD R5-CW-P2-WEIGHT certificate

on:
  pull_request:
    paths:
      - 'work_packages/BSD_R5_CW_P2_WEIGHT_COVER/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-CW-P2-WEIGHT/**'
      - '.gcl/admission/BSD-R5-CW-P2-WEIGHT/**'
      - '.gcl/completions/BSD-R5-CW-P2-WEIGHT/**'
      - 'tools/gcl_campaign_preflight_r5_cw_p2_weight.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-cw-p2-weight-certificate.yml'
      - '.ghos-routing/workflows.json'
  push:
    branches: [main]
    paths:
      - 'work_packages/BSD_R5_CW_P2_WEIGHT_COVER/**'
      - 'handoffs/BSD-001/**'
      - '.gcl/campaigns/BSD-001/**'
      - '.gcl/operations/BSD-R5-CW-P2-WEIGHT/**'
      - '.gcl/admission/BSD-R5-CW-P2-WEIGHT/**'
      - '.gcl/completions/BSD-R5-CW-P2-WEIGHT/**'
      - 'tools/gcl_campaign_preflight_r5_cw_p2_weight.py'
      - 'tools/gcl_completion_receipt_validate_v2.py'
      - '.github/workflows/bsd-r5-cw-p2-weight-certificate.yml'
      - '.ghos-routing/workflows.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert exact subject checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate current or historical operation state
        shell: bash
        run: |
          current=$(python -c "import json; print(json.load(open('.gcl/campaigns/BSD-001/CAMPAIGN_STATE.json'))['current_operation'])")
          if [ "$current" = "BSD-R5-CW-P2-WEIGHT" ]; then
            python tools/gcl_campaign_preflight_r5_cw_p2_weight.py BSD-001 BSD-R5-CW-P2-WEIGHT
          else
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-CW-P2-WEIGHT
          fi
      - name: Replay weight-cover guardrail certificate
        run: python work_packages/BSD_R5_CW_P2_WEIGHT_COVER/03_WEIGHT_COVER_CERTIFICATE.py
      - name: Assert bounded claim firewall
        shell: bash
        run: |
          ledger=work_packages/BSD_R5_CW_P2_WEIGHT_COVER/02_CLAIM_LEDGER.yaml
          grep -q 'BSD-R5-CW-P2-HALF-WEIGHT-005' "$ledger"
          grep -q 'MISSING_P2_COLMEZ_WANG_SQUARE_ROOT_COVER_CHAPTER15_GLOBALIZATION_COMPATIBILITY' "$ledger"
          grep -q 'candidate_disposition: CLOSED' "$ledger"
          grep -q 'r5_res: false' "$ledger"
          grep -q 'r5_prim: false' "$ledger"
          grep -q 'bsd_r2_a1: false' "$ledger"
          grep -q 'mathcert_certification: false' "$ledger"
      - name: Validate completion receipt when present
        shell: bash
        run: |
          if [ -f .gcl/completions/BSD-R5-CW-P2-WEIGHT/COMPLETION_RECEIPT.json ]; then
            python tools/gcl_completion_receipt_validate_v2.py BSD-R5-CW-P2-WEIGHT
          else
            echo 'completion receipt not present in pre-merge candidate'
          fi
