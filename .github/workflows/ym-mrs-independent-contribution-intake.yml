name: YM MRS independent contribution intake

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ym-mrs-contribution-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GCL-CONTRIB] YM-D003-MRS-R002 ') &&
      startsWith(github.event.comment.body, 'GCL-CONTRIBUTION-RESULT/1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Validate exact dispatch and result
        id: validate
        continue-on-error: true
        env:
          OUT_DIR: ${{ runner.temp }}/ym-mrs-intake
        run: |
          python ci/ym_mrs_github_contribution_intake.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$OUT_DIR"

      - name: Report mechanical rejection
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUT_DIR: ${{ runner.temp }}/ym-mrs-intake
        run: |
          error="$(cat "$OUT_DIR/ERRORS.txt")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE REJECTED — FORMAT

$error

Submit one complete replacement GCL-CONTRIBUTION-RESULT/1 comment. Do not edit the rejected comment."

      - name: Stop after rejection
        if: steps.validate.outcome == 'failure'
        run: exit 0

      - name: Load validated intake metadata
        if: steps.validate.outcome == 'success'
        id: meta
        env:
          OUT_DIR: ${{ runner.temp }}/ym-mrs-intake
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta=json.loads((Path(os.environ["OUT_DIR"])/"META.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              for k in ("dispatch_id","comment_id","issue_number","raw_repo_path","receipt_repo_path","branch"):
                  print(f"{k}={meta[k]}",file=f)
          PY

      - name: Inspect first-valid-result state
        if: steps.validate.outcome == 'success'
        id: state
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
        run: |
          raw_dir="$(dirname "$RAW_PATH")"
          if [ -d "$raw_dir" ] && find "$raw_dir" -maxdepth 1 -type f -name 'github-comment-*.md' -print -quit | grep -q .; then
            main_captured=true
          else
            main_captured=false
          fi
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
          else
            branch_exists=false
          fi
          echo "main_captured=$main_captured" >> "$GITHUB_OUTPUT"
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"

      - name: Report already protected result
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE ALREADY PROTECTED — first valid evidence is already on protected main. No replacement result was admitted."

      - name: Report already captured evidence branch
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'false' && steps.state.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE ALREADY CAPTURED — the first valid result already has an evidence branch. No replacement result was admitted."

      - name: Snapshot first valid result and receipt
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'false' && steps.state.outputs.branch_exists == 'false'
        env:
          OUT_DIR: ${{ runner.temp }}/ym-mrs-intake
          RAW_PATH: ${{ steps.meta.outputs.raw_repo_path }}
          RECEIPT_PATH: ${{ steps.meta.outputs.receipt_repo_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          DISPATCH_ID: ${{ steps.meta.outputs.dispatch_id }}
          COMMENT_ID: ${{ steps.meta.outputs.comment_id }}
        run: |
          git switch -c "$BRANCH"
          mkdir -p "$(dirname "$RAW_PATH")" "$(dirname "$RECEIPT_PATH")"
          cp "$OUT_DIR/RAW.md" "$RAW_PATH"
          cp "$OUT_DIR/RECEIPT.json" "$RECEIPT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RAW_PATH" "$RECEIPT_PATH"
          git commit -m "YM-D003 MRS intake: snapshot $DISPATCH_ID comment $COMMENT_ID"
          git push origin "$BRANCH"

      - name: Report captured intake
        if: steps.validate.outcome == 'success' && steps.state.outputs.main_captured == 'false' && steps.state.outputs.branch_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="INTAKE CAPTURED — raw evidence and receipt were committed to the dispatch evidence branch. Mathematical status remains unadjudicated; GCL synthesis owns any canonical use."
