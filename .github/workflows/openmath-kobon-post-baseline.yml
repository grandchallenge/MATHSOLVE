name: OPENMATH Kobon post-baseline tranche

on:
  pull_request:
    paths:
      - "work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES/**"
      - ".github/workflows/openmath-kobon-post-baseline.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  face-search-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: H1-02 proof falsification tests
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: python -m unittest -v test_face_criterion.py

      - name: H1-06 deterministic diversified search replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python search_tranche.py --verify-committed --output /tmp/search-tranche.json
          cat /tmp/search-tranche.json

      - name: H1-07 independent direct oracle replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          python kobon_direct_oracle.py candidates/RD_LOCAL_MUTATION_086/solution.json --n 18 --expect 86 --output /tmp/rd-oracle.json
          python kobon_direct_oracle.py candidates/RG_STRUCTURED_FAMILY_058/solution.json --n 18 --expect 58 --output /tmp/rg-oracle.json

      - name: Install pinned uv launcher
        run: python -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Install official AutoLab CLI
        run: |
          curl -fsSL https://app.autolab.ai/install.sh -o /tmp/autolab-install.sh
          sha256sum /tmp/autolab-install.sh
          sh /tmp/autolab-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/autolab" --version

      - name: Authenticate AutoLab
        env:
          AUTOLAB_TOKEN: ${{ secrets.AUTOLAB_TOKEN }}
        run: |
          if [ -z "$AUTOLAB_TOKEN" ]; then exit 42; fi
          "$HOME/.local/bin/autolab" login --token "$AUTOLAB_TOKEN"
          "$HOME/.local/bin/autolab" whoami

      - name: Pull public Kobon hill
        run: |
          "$HOME/.local/bin/autolab" hills pull alejandrozu/kobon-triangles
          uv tool run --from hills==0.11.0 hills describe kobon-triangles

      - name: H1-07 AutoLab replay
        working-directory: work_packages/OPENMATH_2026/OM26_H1_KOBON_TRIANGLES
        run: |
          set -o pipefail
          uv tool run --from hills==0.11.0 hills eval candidates/RD_LOCAL_MUTATION_086 -H kobon-triangles --current --json | tee /tmp/rd-autolab.json
          uv tool run --from hills==0.11.0 hills eval candidates/RG_STRUCTURED_FAMILY_058 -H kobon-triangles --current --json | tee /tmp/rg-autolab.json
          python - <<'PY'
          import json
          from pathlib import Path
          def metric(path):
              report=json.loads(Path(path).read_text()); stack=[report]
              while stack:
                  value=stack.pop()
                  if isinstance(value,dict):
                      if value.get("name")=="triangles" and isinstance(value.get("value"),(int,float)): return value["value"]
                      stack.extend(value.values())
                  elif isinstance(value,list): stack.extend(value)
              raise RuntimeError("triangles metric missing")
          rd=metric("/tmp/rd-autolab.json"); rg=metric("/tmp/rg-autolab.json")
          if rd!=86: raise SystemExit(f"R-D AutoLab discrepancy: {rd} != 86")
          if rg!=58: raise SystemExit(f"R-G AutoLab discrepancy: {rg} != 58")
          print("H1_07_RD_AUTOLAB_TRIANGLES=86")
          print("H1_07_RG_AUTOLAB_TRIANGLES=58")
          print("H1_07_AUTOLAB_CONCORDANCE=PASS")
          PY
