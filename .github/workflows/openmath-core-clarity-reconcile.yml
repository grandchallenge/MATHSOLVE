name: OPENMATH Core Clarity reconciliation

on:
  pull_request:
    paths:
      - ".gcl/campaigns/OPENMATH-2026/CEX_ASSIGNMENTS.json"
      - ".gcl/operations/OM26-CORE-CLARITY-RECONCILE-001/**"
      - ".gcl/admission/OM26-CORE-CLARITY-RECONCILE-001/**"
      - "work_packages/OPENMATH_2026/HILL_LANES.json"
      - "work_packages/OPENMATH_2026/CORE_CLARITY_LIFECYCLE_READBACK.json"
      - "handoffs/OPENMATH-2026/CEX_JOB_BOARD.md"
      - "contributions/OPENMATH-2026/OM26-H1/H1-12/raw/**"
      - "contributions/OPENMATH-2026/OM26-H1/H1-12/receipts/**"
      - "ci/validate_openmath_core_clarity_reconcile.py"
      - "ci/validate_openmath_cex_job_board.py"
      - "ci/test_openmath_cex_job_board.py"
      - ".github/workflows/openmath-core-clarity-reconcile.yml"
      - ".gcl/campaigns/OPENMATH-2026/LIFECYCLE_CONTRACT.json"
      - "ci/openmath_lifecycle_acceptance.py"
      - "ci/openmath_lifecycle_candidate.py"
      - "tests/test_openmath_lifecycle_acceptance.py"
      - ".github/workflows/openmath-cex-independent-contribution-intake.yml"
      - ".ghos-routing/workflows.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject checkout
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Validate Core Clarity reconciliation
        run: python ci/validate_openmath_core_clarity_reconcile.py

      - name: Validate CEX lifecycle registry
        run: python ci/validate_openmath_cex_job_board.py

      - name: Run CEX lifecycle tests
        run: python -m unittest ci.test_openmath_cex_job_board

      - name: Run generic intake regression tests
        run: python -m unittest tests.test_openmath_cex_github_contribution_intake

      - name: Prove unattended RETURNED to ADVANCED acceptance test
        run: |
          python ci/openmath_lifecycle_acceptance.py --output "$RUNNER_TEMP/openmath-lifecycle-acceptance.json"
          python -m unittest tests.test_openmath_lifecycle_acceptance
