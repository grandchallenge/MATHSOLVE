[project]
name = "gcl-commander"
version = "0.2.1"
description = "GCL-owned scoped local operator and MCP service"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gcl-commander = "gcl_commander.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gcl_commander*"]
